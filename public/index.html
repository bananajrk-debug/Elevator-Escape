<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>消しゴム奪取＆エレベーター脱出</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; font-family: "Hiragino Sans", "Meiryo", "Noto Sans JP", sans-serif; color: #fff; user-select: none; }
  canvas#game { display: block; width: 100vw; height: 100vh; }
  #mini { position: fixed; top: 12px; right: 12px; width: 160px; height: 160px; border: 2px solid #888; background: #111; display: none; border-radius: 6px; }
  #hud { position: fixed; top: 12px; left: 12px; font-size: 15px; text-shadow: 0 0 4px #000; display: none; line-height: 1.7; }
  #toast { position: fixed; bottom: 40px; left: 50%; transform: translateX(-50%); text-align: center; pointer-events: none; z-index: 3; }
  #toast div { background: rgba(0,0,0,.72); padding: 6px 14px; margin-top: 6px; border-radius: 6px; font-size: 16px; }
  #banner { position: fixed; top: 70px; left: 50%; transform: translateX(-50%); font-size: 20px; font-weight: 800; text-align: center; text-shadow: 0 0 8px #000; display: none; pointer-events: none; }
  #placeBtn { position: fixed; bottom: 90px; left: 50%; transform: translateX(-50%); display: none; z-index: 4; }

  /* ---------- 共通UI ---------- */
  .overlay { position: fixed; inset: 0; display: none; z-index: 5; }
  .btn { border: none; color: #fff; cursor: pointer; font-weight: 900; font-family: inherit; border-radius: 14px; transition: transform .08s, box-shadow .08s; letter-spacing: 1px; }
  .btn:active { transform: translateY(4px); }
  .btn:disabled { opacity: .45; cursor: default; }
  .btn.yellow { background: #ffd23f; color: #3a2a00; box-shadow: 0 6px 0 #c79a00, 0 10px 18px rgba(0,0,0,.4); }
  .btn.yellow:active { box-shadow: 0 2px 0 #c79a00; }
  .btn.blue { background: #2f8cff; box-shadow: 0 6px 0 #1457b3, 0 10px 18px rgba(0,0,0,.4); }
  .btn.blue:active { box-shadow: 0 2px 0 #1457b3; }
  .btn.gray { background: #4b5568; box-shadow: 0 5px 0 #2b3342; }
  .btn.gray:active { box-shadow: 0 1px 0 #2b3342; }
  .btn.red { background: #ef4444; box-shadow: 0 6px 0 #a11d1d; }
  .btn.red:active { box-shadow: 0 2px 0 #a11d1d; }
  .bg { background: radial-gradient(circle at 50% 35%, #5b3cc4 0%, #2a1a6e 45%, #120a33 100%); overflow: hidden; }
  .bg::before { content: ""; position: absolute; inset: -50%; background: repeating-linear-gradient(60deg, rgba(255,255,255,.045) 0 40px, rgba(255,255,255,0) 40px 120px); animation: slide 14s linear infinite; }
  @keyframes slide { to { transform: translateX(160px); } }

  /* ---------- スタート画面 ---------- */
  #title { align-items: center; justify-content: center; flex-direction: column; text-align: center; }
  .logo { position: relative; font-size: clamp(34px, 7vw, 76px); font-weight: 900; font-style: italic; line-height: 1.05; -webkit-text-stroke: 3px #1b0f4d; paint-order: stroke fill; text-shadow: 0 6px 0 #1b0f4d, 0 12px 24px rgba(0,0,0,.5); background: linear-gradient(#fff6b0, #ffb703); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .logo small { display: block; font-size: .4em; -webkit-text-stroke: 2px #1b0f4d; letter-spacing: 4px; }
  .center { position: relative; display: flex; flex-direction: column; align-items: center; gap: 14px; width: min(92vw, 460px); margin-top: 26px; }
  .center .btn.big { width: 100%; font-size: 26px; padding: 20px 10px; }
  .field { width: 100%; font-size: 20px; font-weight: 800; padding: 13px 16px; border-radius: 12px; border: 3px solid #1b0f4d; background: #fff; color: #1b0f4d; text-align: center; outline: none; font-family: inherit; }
  .field::placeholder { color: #9a93bd; font-weight: 700; }
  .joinrow { display: flex; gap: 10px; width: 100%; }
  .joinrow .field { letter-spacing: 8px; font-size: 24px; }
  .joinrow .btn { font-size: 18px; padding: 0 22px; white-space: nowrap; }
  #err { min-height: 22px; color: #ff9aa2; font-weight: 800; }

  /* ---------- ハンバーガーメニュー & モーダル ---------- */
  #menuBtn { position: fixed; top: 16px; left: 16px; z-index: 25; width: 48px; height: 48px; font-size: 24px; padding: 0; border-radius: 50%; }
  #menuModal { background: rgba(5,3,20,.88); align-items: center; justify-content: center; z-index: 40; }
  .panel { background: #1e1b4b; border: 4px solid #ffd23f; border-radius: 18px; padding: 22px 28px; width: min(92vw, 460px); box-shadow: 0 10px 0 rgba(0,0,0,.4); }
  .panel h2 { margin: 0 0 10px; font-style: italic; color: #ffd23f; }
  .tabs { display: flex; gap: 6px; margin-bottom: 14px; }
  .tab-btn { flex: 1; padding: 8px; background: #3b3780; border: none; border-radius: 8px; color: #fff; font-weight: 900; cursor: pointer; }
  .tab-btn.active { background: #ffd23f; color: #3a2a00; }

  /* ---------- フォートナイト・ブロスタ風ロビー ---------- */
  #lobby .top-left { position: absolute; top: 16px; left: 76px; z-index: 2; display: flex; gap: 8px; }
  #codePill { position: absolute; top: 14px; right: 16px; z-index: 2; cursor: pointer; background: rgba(10,6,32,.75); border: 3px solid #ffd23f; border-radius: 16px; padding: 6px 18px 8px; text-align: center; box-shadow: 0 5px 0 #c79a00; }
  #codePill:active { transform: translateY(3px); box-shadow: 0 2px 0 #c79a00; }
  #codePill .lab { font-size: 11px; letter-spacing: 3px; color: #ffd23f; font-weight: 800; }
  #codePill .num { font-size: 32px; font-weight: 900; letter-spacing: 6px; font-style: italic; }

  .stage-arena { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; pointer-events: none; gap: 24px; flex-wrap: wrap; padding: 80px 20px 140px; }
  .spot-podium { position: absolute; width: 640px; height: 320px; border-radius: 50%; background: radial-gradient(circle, rgba(255,255,255,.2), rgba(255,255,255,0) 70%); top: 55%; left: 50%; transform: translate(-50%, -50%); }
  
  .brawler-card { display: flex; flex-direction: column; align-items: center; position: relative; pointer-events: auto; animation: bob 2.2s ease-in-out infinite; }
  .brawler-avatar { width: 110px; height: 110px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 54px; background: radial-gradient(circle at 35% 30%, #7db6ff, #2f5fd0); border: 5px solid #fff; box-shadow: 0 10px 0 rgba(0,0,0,.35), 0 0 30px rgba(120,160,255,.6); position: relative; }
  .brawler-avatar.oni { background: radial-gradient(circle at 35% 30%, #ff8d8d, #c21e1e); box-shadow: 0 10px 0 rgba(0,0,0,.35), 0 0 30px rgba(255,90,90,.6); }
  .brawler-nameplate { margin-top: 8px; padding: 4px 14px; font-size: 16px; font-weight: 900; font-style: italic; background: #ffd23f; color: #3a2a00; border-radius: 6px; box-shadow: 0 3px 0 #c79a00; white-space: nowrap; }
  .brawler-rolefoot { margin-top: 4px; font-size: 20px; filter: drop-shadow(0 2px 4px #000); }

  @keyframes bob { 50% { transform: translateY(-8px); } }

  .bottom-left { position: absolute; left: 16px; bottom: 18px; z-index: 2; display: flex; gap: 10px; flex-wrap: wrap; }
  .bottom-left .btn { font-size: 16px; padding: 14px 18px; }
  .bottom-left .btn.active { background: #ffd23f; color: #3a2a00; box-shadow: 0 5px 0 #c79a00; }
  #start { position: absolute; right: 18px; bottom: 18px; z-index: 2; font-size: 32px; padding: 20px 46px; font-style: italic; }
  #lnote { position: absolute; bottom: 92px; right: 22px; z-index: 2; font-size: 13px; color: #d6d0ff; text-align: right; max-width: 320px; }

  #codeModal { background: rgba(8,4,28,.92); align-items: center; justify-content: center; flex-direction: column; cursor: pointer; z-index: 8; }
  #codeModal .lab { letter-spacing: 8px; color: #ffd23f; font-weight: 900; font-size: clamp(14px, 3vw, 28px); }
  #codeModal .big { font-size: clamp(60px, 22vw, 260px); font-weight: 900; font-style: italic; letter-spacing: .12em; line-height: 1.1; -webkit-text-stroke: 4px #1b0f4d; paint-order: stroke fill; background: linear-gradient(#fff6b0, #ffb703); -webkit-background-clip: text; background-clip: text; color: transparent; text-shadow: 0 8px 0 #1b0f4d; }
  #codeModal .sub { margin-top: 16px; color: #cfc9f5; }
  #codeModal .btn { margin-top: 20px; font-size: 20px; padding: 14px 34px; }

  #result { background: rgba(0,0,0,.82); align-items: center; justify-content: center; flex-direction: column; text-align: center; }
  #result h1 { font-size: 64px; margin: 0 0 8px; font-style: italic; -webkit-text-stroke: 2px #000; }
  #result p { color: #ddd; margin: 6px 0; font-size: 18px; }
  #ptimer { position: fixed; top: 54px; left: 50%; transform: translateX(-50%); width: min(80vw, 440px); text-align: center; display: none; pointer-events: none; text-shadow: 0 2px 8px #000; }
  #ptimer .pt-lab { font-size: 16px; font-weight: 800; color: #fff; }
  #ptimer .pt-num { font-size: 68px; font-weight: 900; font-style: italic; line-height: 1.05; color: #ffd23f; -webkit-text-stroke: 2px #3a2a00; paint-order: stroke fill; }
  #ptimer .pt-bar { height: 10px; background: rgba(255,255,255,.2); border-radius: 6px; overflow: hidden; margin-top: 6px; }
  #ptFill { height: 100%; width: 100%; background: linear-gradient(90deg, #ffd23f, #ff7b00); }
  #itemBtn { position: fixed; right: 18px; bottom: 22px; display: none; z-index: 4; font-size: 20px; padding: 14px 22px; }
  .skins { position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%); display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; max-width: 50vw; z-index: 2; }
  .sk { width: 44px; height: 44px; border-radius: 50%; border: 4px solid rgba(255,255,255,.55); cursor: pointer; font-size: 20px; display: flex; align-items: center; justify-content: center; font-weight: 900; transition: transform .1s; }
  .sk:hover { transform: scale(1.12); }
  .sk.sel { border-color: #ffd23f; box-shadow: 0 0 0 3px #3a2a00, 0 0 18px #ffd23f; transform: scale(1.18); }
  #skname { position: absolute; bottom: 76px; left: 50%; transform: translateX(-50%); font-weight: 800; font-size: 14px; color: #ffe58a; z-index: 2; }

  body { touch-action: none; -webkit-user-select: none; -webkit-touch-callout: none; }
  #gear { position: fixed; top: 12px; right: 16px; z-index: 15; width: 48px; height: 48px; font-size: 24px; padding: 0; border-radius: 50%; }
  body.scr-lobby #gear { right: 250px; }
  body.scr-game #gear { right: 182px; }
  #settings { background: rgba(5,3,20,.88); align-items: center; justify-content: center; z-index: 30; }
  .row { display: flex; align-items: center; gap: 12px; margin: 14px 0; font-weight: 800; }
  .row input[type=range] { flex: 1; accent-color: #ffd23f; height: 30px; margin: 0; padding: 0; background: none; }
  .row .val { width: 46px; text-align: right; }
  .seg { display: flex; gap: 10px; }
  .seg .btn { flex: 1; padding: 12px 6px; font-size: 16px; line-height: 1.3; }
  .seg .btn small { font-weight: 600; opacity: .85; }
  .seg .btn.active { background: #ffd23f; color: #3a2a00; box-shadow: 0 5px 0 #c79a00; }
  #hpbar { position: fixed; bottom: 26px; left: 50%; transform: translateX(-50%); width: min(60vw, 340px); display: none; pointer-events: none; text-shadow: 0 2px 6px #000; text-align: center; }
  #hpbar .hp-lab { font-weight: 900; font-size: 15px; }
  #hpbar .hp-track { height: 16px; background: rgba(0,0,0,.6); border: 2px solid #fff; border-radius: 9px; overflow: hidden; margin-top: 3px; }
  #hpFill { height: 100%; width: 100%; background: linear-gradient(90deg, #22c55e, #86efac); transition: width .2s; }
  #prompt { position: fixed; bottom: 78px; left: 50%; transform: translateX(-50%); font-weight: 900; font-size: 18px; color: #fde68a; text-shadow: 0 2px 8px #000; display: none; pointer-events: none; text-align: center; }
  #touch { display: none; }
  #dpad { position: fixed; left: 22px; bottom: 22px; width: 160px; height: 160px; border-radius: 50%; background: rgba(255,255,255,.12); border: 3px solid rgba(255,255,255,.35); touch-action: none; z-index: 12; }
  #knob { position: absolute; left: 50%; top: 50%; width: 64px; height: 64px; margin: -32px 0 0 -32px; border-radius: 50%; background: rgba(255,255,255,.5); pointer-events: none; }
  .tb { position: fixed; border-radius: 50%; border: 3px solid rgba(255,255,255,.55); background: rgba(40,40,70,.6); color: #fff; font-weight: 900; display: flex; align-items: center; justify-content: center; text-align: center; touch-action: none; z-index: 12; line-height: 1.15; }
  #tbSpace { right: 26px; bottom: 30px; width: 116px; height: 116px; font-size: 20px; background: rgba(255,210,63,.55); }
  #tbQ { right: 156px; bottom: 56px; width: 86px; height: 86px; font-size: 20px; }
  #tbMap { right: 30px; bottom: 164px; width: 62px; height: 62px; font-size: 15px; }
  #fullmap { position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%); width: min(86vh, 92vw); height: min(86vh, 92vw); display: none; z-index: 9; border: 4px solid #ffd23f; border-radius: 12px; background: #080614; }

  :root { --sp: clamp(86px, 18vmin, 140px); --sm: clamp(60px, 12vmin, 96px); --gap: 2vmin; --dp: clamp(120px, 27vmin, 210px); --mini: clamp(104px, 21vmin, 176px);
          --padR: calc(env(safe-area-inset-right, 0px) + 3vmin); --padL: calc(env(safe-area-inset-left, 0px) + 3vmin);
          --padB: calc(env(safe-area-inset-bottom, 0px) + 3.2vmin); --padT: calc(env(safe-area-inset-top, 0px) + 10px); }
  html, body { height: 100dvh; }
  canvas#game { width: 100vw; height: 100dvh; }
  #hud { font-size: clamp(12px, 2.1vmin, 16px); top: var(--padT); left: calc(env(safe-area-inset-left, 0px) + 12px); max-width: 46vw; }
  #mini { width: var(--mini); height: var(--mini); top: var(--padT); right: calc(env(safe-area-inset-right, 0px) + 12px); }
  #gear { width: clamp(40px, 6.5vmin, 52px); height: clamp(40px, 6.5vmin, 52px); top: var(--padT); right: calc(env(safe-area-inset-right, 0px) + 16px); }
  body.scr-lobby #gear { right: calc(env(safe-area-inset-right, 0px) + 250px); }
  body.scr-game #gear { right: calc(env(safe-area-inset-right, 0px) + var(--mini) + 22px); }
  #ptimer { top: calc(var(--padT) + 36px); }
  #ptimer .pt-num { font-size: clamp(44px, 9vmin, 68px); }
  #banner { font-size: clamp(15px, 2.8vmin, 22px); top: calc(var(--padT) + 14vmin); }
  #toast { bottom: calc(env(safe-area-inset-bottom, 0px) + 6vmin); }
  #toast div { font-size: clamp(13px, 2.2vmin, 16px); }
  #hpbar { bottom: calc(env(safe-area-inset-bottom, 0px) + 2.5vmin); }
  #prompt { bottom: calc(env(safe-area-inset-bottom, 0px) + 9vmin); font-size: clamp(14px, 2.6vmin, 20px); }
  #dpad { left: var(--padL); bottom: var(--padB); width: var(--dp); height: var(--dp); }
  #knob { width: 40%; height: 40%; margin: -20% 0 0 -20%; }
  .tb { font-size: clamp(14px, 2.8vmin, 22px); }
  #tbSpace { right: var(--padR); bottom: var(--padB); width: var(--sp); height: var(--sp); }
  #tbQ { right: calc(var(--padR) + var(--sp) + var(--gap)); bottom: var(--padB); width: var(--sm); height: var(--sm); }
  #tbCrouch { right: var(--padR); bottom: calc(var(--padB) + var(--sp) + var(--gap)); width: var(--sm); height: var(--sm); background: rgba(16,185,129,.5); font-size: clamp(12px, 2.2vmin, 17px); }
  #tbMap { right: calc(var(--padR) + var(--sm) + var(--gap)); bottom: calc(var(--padB) + var(--sp) + var(--gap)); width: calc(var(--sm) * .8); height: calc(var(--sm) * .8); font-size: clamp(11px, 2vmin, 15px); }
  #itemBtn { right: var(--padR); bottom: calc(env(safe-area-inset-bottom, 0px) + 3vmin); }
  #fullmap { width: min(86dvh, 92vw); height: min(86dvh, 92vw); }
  .panel { max-height: 90dvh; overflow: auto; }

  #chatBtn { position: fixed; z-index: 14; display: none; width: clamp(40px, 6.5vmin, 52px); height: clamp(40px, 6.5vmin, 52px); font-size: clamp(18px, 3.2vmin, 24px); padding: 0; border-radius: 50%; left: calc(env(safe-area-inset-left, 0px) + 12px); bottom: calc(env(safe-area-inset-bottom, 0px) + 12px); }
  body.scr-game #chatBtn { display: block; }
  body.scr-lobby #chatBtn { display: block; left: auto; bottom: auto; right: calc(env(safe-area-inset-right, 0px) + 16px); top: 100px; }
  #chatPal { position: fixed; z-index: 14; display: none; width: min(94vw, 440px); padding: 10px; background: rgba(20,16,60,.94); border: 3px solid #ffd23f; border-radius: 14px; grid-template-columns: repeat(4, 1fr); gap: 8px; left: calc(env(safe-area-inset-left, 0px) + 12px); bottom: calc(env(safe-area-inset-bottom, 0px) + 70px); }
  body.scr-lobby #chatPal { left: auto; bottom: auto; right: calc(env(safe-area-inset-right, 0px) + 16px); top: 156px; }
  #chatPal button { font-size: 15px; padding: 10px 4px; border-radius: 10px; border: none; background: #3b3780; color: #fff; font-weight: 800; cursor: pointer; font-family: inherit; touch-action: manipulation; }
  #chatPal button.st { font-size: 26px; padding: 4px; }
  #chatPal button:active { background: #ffd23f; color: #3a2a00; }
  .bub { position: absolute; left: 100%; margin-left: 10px; top: 50%; transform: translateY(-50%); background: #fff; color: #111; padding: 4px 10px; border-radius: 10px; font-weight: 800; white-space: nowrap; font-size: 15px; z-index: 3; }
  #rules { background: rgba(5,3,20,.88); align-items: center; justify-content: center; z-index: 30; }
  .tgrow { display: flex; flex-wrap: wrap; gap: 8px; margin: 8px 0 16px; }
  .tgrow .btn { flex: 1 1 45%; padding: 10px 6px; font-size: 15px; }
  .tgrow .btn.active { background: #22c55e; box-shadow: 0 5px 0 #15803d; }
  .row input[type=range]:disabled { opacity: .5; }
</style>
</head>
<body>
<canvas id="game"></canvas>
<canvas id="mini" width="160" height="160"></canvas>
<div id="hud"></div>
<div id="banner"></div>

<!-- ハンバーガーメニューボタン -->
<button id="menuBtn" class="btn gray">☰</button>

<button id="gear" class="btn gray" aria-label="設定">⚙</button>
<button id="chatBtn" class="btn gray" aria-label="スタンプ">💬</button>
<div id="chatPal"></div>
<div id="hpbar"><div class="hp-lab" id="hpLab"></div><div class="hp-track"><div id="hpFill"></div></div></div>
<div id="prompt"></div>
<canvas id="fullmap" width="640" height="640"></canvas>
<div id="touch">
  <div id="dpad"><div id="knob"></div></div>
  <div class="tb" id="tbQ">Q</div>
  <div class="tb" id="tbSpace">SPACE</div>
  <div class="tb" id="tbCrouch">しゃがみ</div>
  <div class="tb" id="tbMap">MAP</div>
</div>

<!-- ハンバーガーメニューモーダル (プロフィール・フレンド機能) -->
<div id="menuModal" class="overlay">
  <div class="panel">
    <h2>📋 メニュー</h2>
    <div class="tabs">
      <button class="tab-btn active" id="tabProfileBtn">プロフィール</button>
      <button class="tab-btn" id="tabFriendsBtn">フレンド</button>
    </div>
    
    <!-- プロフィール設定タブ -->
    <div id="contentProfile">
      <div class="row"><span>ユーザー名</span></div>
      <input id="profileNameField" class="field" maxlength="12" placeholder="プレイヤー名">
      <div class="row" style="margin-top:12px;"><span>フレンド追加パスワード (自由設定)</span></div>
      <input id="profilePassField" class="field" type="password" maxlength="20" placeholder="友達に教える合言葉">
      <div style="text-align:center;margin-top:14px"><button class="btn yellow" id="saveProfileBtn">保存する</button></div>
    </div>

    <!-- フレンド追加＆リストタブ -->
    <div id="contentFriends" style="display:none;">
      <div style="font-size:14px;color:#cbd5e1;margin-bottom:8px">友達のユーザー名とパスワードを入力して追加！</div>
      <div class="row"><input id="addFriendNameInput" class="field" placeholder="友達のユーザー名" maxlength="12"></div>
      <div class="row"><input id="addFriendPassInput" class="field" type="password" placeholder="友達のパスワード" maxlength="20"></div>
      <button class="btn blue" id="submitAddFriendBtn" style="width:100%;padding:10px;margin-bottom:12px">フレンドを追加する</button>
      
      <div style="font-size:14px;color:#ffd23f;margin-top:10px;margin-bottom:4px;font-weight:800;">フレンドリスト</div>
      <div id="friendListContainer" style="max-height:140px;overflow:auto;background:rgba(0,0,0,0.3);border-radius:8px;padding:8px">
        <p style="text-align:center;color:#9ca3af;font-size:13px;" id="noFriendsText">登録フレンドはまだいません</p>
      </div>
    </div>

    <div style="text-align:center;margin-top:18px"><button class="btn gray" id="menuCloseBtn" style="padding:10px 24px">閉じる</button></div>
  </div>
</div>

<div id="settings" class="overlay">
  <div class="panel">
    <h2>⚙ 設定</h2>
    <div class="row"><span style="width:84px">BGM音量</span><input type="range" id="setBgm" min="0" max="100"><span class="val" id="vBgm"></span></div>
    <div class="row"><span style="width:84px">SE音量</span><input type="range" id="setSe" min="0" max="100"><span class="val" id="vSe"></span></div>
    <div style="font-weight:800;margin-top:6px">デバイス</div>
    <div class="seg" style="margin:8px 0 18px">

<script src="/socket.io/socket.io.js"></script>
<script>
const socket = io();
const $ = (id) => document.getElementById(id);
const cv = $('game'), ctx = cv.getContext('2d');

const fm = $('fullmap'), fctx = fm.getContext('2d');

const show = (id, on) => { $(id).style.display = on ? 'flex' : 'none'; };
const setScreen = (s) => { document.body.className = 'scr-' + s + (settings.mode === 'ipad' ? ' ipad' : ''); };

let world = null, cfg = null, mazeCanvas = null, state = null, inGame = false;
let myRole = 'runner', myName = '', lobbyData = null, TH = 0, mySkin = 0, skinSel = 0, soloMode = false;
let resultShown = false, ended = false, views = {}, camV = null, meV = null, fxs = [], mapOpen = false;
let bdStart = 0, lastSec = -1, prevOpen = false, lastPlaceSec = -1, lastBoardBeep = 0, SX = 0, SY = 0;
let VW = innerWidth, VH = innerHeight, DPR = 1, vs = 1;
function ZOOM() { return cfg.zoom * vs; }
try { skinSel = parseInt(localStorage.getItem('pskin'), 10) || 0; } catch (e) {}

const SKINS = [
  { n: 'スカイ', c: '#3b82f6', r: '#ffffff', m: '', o: '#dc2626', h: '#1f2937' },
  { n: 'ミント', c: '#10b981', r: '#d1fae5', m: '♪', o: '#b91c1c', h: '#7c2d12' },
  { n: 'サンセット', c: '#f97316', r: '#fff7ed', m: '☀', o: '#9a3412', h: '#111827' },
  { n: 'ベリー', c: '#ec4899', r: '#ffffff', m: '♥', o: '#be123c', h: '#4b2e83' },
  { n: 'ライム', c: '#84cc16', r: '#1a2e05', m: '★', o: '#7f1d1d', h: '#854d0e' },
  { n: 'バイオレット', c: '#8b5cf6', r: '#ede9fe', m: '☾', o: '#6d28d9', h: '#0f172a' },
  { n: 'ゴールド', c: '#eab308', r: '#422006', m: '⚡', o: '#a16207', h: '#fde68a' },
  { n: 'モノクロ', c: '#e5e7eb', r: '#111827', m: '☻', o: '#450a0a', h: '#6b7280' }
];

// ハンバーガーメニュー制御
let myFriendsList = [];
$('menuBtn').onclick = () => {

function updateFriendUI() {

// ================= 設定・音量・デバイス =================
let settings = { bgm: 0.5, se: 0.8, mode: null };
try { Object.assign(settings, JSON.parse(localStorage.getItem('settings') || '{}')); } catch (e) {}
if (!settings.mode) settings.mode = (navigator.maxTouchPoints > 0 && /iPad|Macintosh|Android/.test(navigator.userAgent)) ? 'ipad' : 'pc';
function saveSettings() { try { localStorage.setItem('settings', JSON.stringify(settings)); } catch (e) {} }

let AC = null, bgmG = null, seG = null, bgmTimer = null, bgmMode = '', bgmStep = 0;
function initAudio() {
  if (AC) { if (AC.state === 'suspended') AC.resume(); return; }
  try {
    AC = new (window.AudioContext || window.webkitAudioContext)();
    bgmG = AC.createGain(); seG = AC.createGain(); bgmG.connect(AC.destination); seG.connect(AC.destination);
    applyVol(); const m = bgmMode || 'lobby'; bgmMode = ''; setBgm(m);
  } catch (e) {}
}
function applyVol() { if (!AC) return; bgmG.gain.value = settings.bgm * 0.35; seG.gain.value = settings.se; }
function tone(dest, f, d, v, type) {
  if (!AC) return;
  const t = AC.currentTime, o = AC.createOscillator(), g = AC.createGain();
  o.type = type || 'square'; o.frequency.value = f;
  g.gain.setValueAtTime(v, t); g.gain.exponentialRampToValueAtTime(0.0001, t + d);
  o.connect(g); g.connect(dest); o.start(t); o.stop(t + d + 0.02);
}
function beep(f, d, v, type) { tone(seG, f, d, v || 0.06, type); }
const BGM = {
  lobby: { iv: 300, notes: [0, 4, 7, 12, 7, 4, 2, 5, 9, 5], root: 220, type: 'triangle', v: 0.22 },
  game: { iv: 240, notes: [0, null, 0, 3, null, 0, 7, null, 6, null], root: 110, type: 'sawtooth', v: 0.13 },
  rush: { iv: 140, notes: [0, 0, 3, 0, 0, 5, 0, 6], root: 110, type: 'sawtooth', v: 0.2 }
};
function setBgm(mode) {
  if (bgmMode === mode) return;
  bgmMode = mode;
  if (bgmTimer) { clearInterval(bgmTimer); bgmTimer = null; }
  if (!AC) return;
  const p = BGM[mode]; bgmStep = 0;
  bgmTimer = setInterval(() => {
    const n = p.notes[bgmStep++ % p.notes.length];
    if (n === null) return;
    tone(bgmG, p.root * Math.pow(2, n / 12), p.iv / 1000 * 1.6, p.v, p.type);
    if (mode !== 'lobby' && bgmStep % 8 === 0) tone(bgmG, p.root * 4 * Math.pow(2, [0, 1, 6][bgmStep % 3] / 12), 0.6, 0.05, 'sine');
  }, p.iv);
}

function refreshSettingsUI() {
  $('setBgm').value = Math.round(settings.bgm * 100); $('vBgm').textContent = Math.round(settings.bgm * 100);
  $('setSe').value = Math.round(settings.se * 100); $('vSe').textContent = Math.round(settings.se * 100);
  $('modePc').classList.toggle('active', settings.mode === 'pc');
  $('modePad').classList.toggle('active', settings.mode === 'ipad');
}
$('gear').onclick = () => { initAudio(); refreshSettingsUI(); show('settings', true); };
$('setClose').onclick = () => show('settings', false);
$('settings').addEventListener('click', (e) => { if (e.target === $('settings')) show('settings', false); });
$('setBgm').addEventListener('input', (e) => { settings.bgm = e.target.value / 100; $('vBgm').textContent = e.target.value; applyVol(); saveSettings(); });
$('setSe').addEventListener('input', (e) => { settings.se = e.target.value / 100; $('vSe').textContent = e.target.value; applyVol(); saveSettings(); });
$('modePc').onclick = () => { settings.mode = 'pc'; saveSettings(); refreshSettingsUI(); updateTouchUI(); };
$('modePad').onclick = () => { settings.mode = 'ipad'; saveSettings(); refreshSettingsUI(); updateTouchUI(); };

function resize() {
  DPR = Math.min(2, window.devicePixelRatio || 1);
  VW = innerWidth; VH = innerHeight;
  cv.width = Math.round(VW * DPR); cv.height = Math.round(VH * DPR);
  vs = clamp(Math.min(VW, VH) / 720, 0.8, 1.3);
}
addEventListener('resize', resize); addEventListener('orientationchange', resize); resize();
setScreen('title');

try {
  $('name').value = localStorage.getItem('pname') || '';
  socket.emit('updateProfile', { name: $('name').value, password: localStorage.getItem('ppass') || '' });
} catch (e) {}

function nm() {
  const v = $('name').value.trim();
  try {
    localStorage.setItem('pname', v);
    socket.emit('updateProfile', { name: v, password: localStorage.getItem('ppass') || '' });
  } catch (e) {}
  return v;
}

$('btnCreate').onclick = () => { initAudio(); $('err').textContent = ''; socket.emit('create', { name: nm(), skin: skinSel }); };
$('btnSolo').onclick = () => { initAudio(); $('err').textContent = ''; socket.emit('solo', { name: nm(), skin: skinSel }); };
$('btnJoin').onclick = () => { initAudio(); $('err').textContent = ''; socket.emit('join', { name: nm(), code: $('code').value, skin: skinSel }); };
$('code').addEventListener('input', () => { $('code').value = $('code').value.replace(/\D/g, '').slice(0, 5); });
$('code').addEventListener('keydown', (e) => { if (e.key === 'Enter') $('btnJoin').click(); });
socket.on('errmsg', (m) => { $('err').textContent = m; });

const roleLabel = { auto: 'おまかせ', runner: '逃げ側', oni: '鬼側' };
const roleEmoji = { auto: '🎲', runner: '🏃', oni: '👹' };

socket.on('lobby', (d) => {
  lobbyData = d;
  if (inGame && d.state === 'playing') return;
  if (inGame && resultShown) return;
  if (d.state === 'lobby') { inGame = false; hideGameUI(); show('result', false); }
  if (!inGame) { show('title', false); show('lobby', true); setScreen('lobby'); setBgm('lobby'); renderLobby(); }
});

function renderLobby() {
  const d = lobbyData, me = d.players.find((p) => p.id === d.you) || { name: '', role: 'auto', skin: 0 };
  $('codeNum').textContent = d.code; $('codeBig').textContent = d.code;
  
  const arena = $('brawlersArena'); arena.innerHTML = '';
  for (const p of d.players) {
    const sk = SKINS[p.skin || 0];
    const card = document.createElement('div'); card.className = 'brawler-card';
    
    const avatar = document.createElement('div');
    avatar.className = 'brawler-avatar ' + p.role;
    avatar.textContent = roleEmoji[p.role];
    avatar.style.background = 'radial-gradient(circle at 35% 30%, rgba(255,255,255,.55), ' + (p.role === 'oni' ? sk.o : sk.c) + ' 60%)';
    
    const namePlate = document.createElement('div');
    namePlate.className = 'brawler-nameplate';
    namePlate.textContent = p.name + (p.id === d.host ? ' 👑' : '');

    const roleFoot = document.createElement('div');
    roleFoot.className = 'brawler-rolefoot';
    roleFoot.textContent = roleEmoji[p.role];

    card.append(avatar, namePlate, roleFoot);
    arena.appendChild(card);
  }

  const mySk = SKINS[me.skin || 0];
  skinSel = me.skin || 0; try { localStorage.setItem('pskin', skinSel); } catch (e) {}
  $('skname').textContent = 'スキン：' + mySk.n; buildSkins();

  document.querySelectorAll('#lobby [data-role]').forEach((b) => b.classList.toggle('active', b.dataset.role === me.role));
  const host = d.host === d.you;
  $('start').style.display = host ? '' : 'none';
  $('start').disabled = d.state !== 'lobby';
  $('rulesBtn').style.display = '';
  $('rulesBtn').textContent = host ? '⚙ ルール設定' : '📋 ルール確認';
  $('lnote').textContent = d.state === 'playing' ? '試合中です。終了までお待ちください。' : (host ? '準備完了したらゲーム開始を押してください' : 'ホストの開始を待っています…');
}

function buildSkins() {
  const box = $('skins'); box.innerHTML = '';
  SKINS.forEach((sk, i) => {
    const b = document.createElement('div'); b.className = 'sk' + (i === skinSel ? ' sel' : '');
    b.style.background = sk.c; b.style.color = sk.r; b.textContent = sk.m || '●'; b.title = sk.n;

document.querySelectorAll('#lobby [data-role]').forEach((b) => b.onclick = () => socket.emit('setRole', b.dataset.role));
$('start').onclick = () => { initAudio(); socket.emit('start'); };
$('leave').onclick = () => { socket.emit('leave'); lobbyData = null; show('lobby', false); show('title', true); setScreen('title'); };

$('codeModal').onclick = () => show('codeModal', false);

function hideGameUI() {

socket.on('init', (w) => {
  world = w; cfg = w.cfg; myRole = w.role; myName = w.name; mySkin = w.skin || 0; soloMode = !!w.solo;
  TH = (2 - w.side) * Math.PI / 2;
  buildMaze(); state = null; views = {}; camV = null; meV = null; prevOpen = false; lastSec = -1; ended = false; resultShown = false;
  fxs = []; mapOpen = false; fm.style.display = 'none'; bdStart = 0; lastPlaceSec = -1;
  for (const k in keys) keys[k] = 0;
  inGame = true;
  show('title', false); show('lobby', false); show('result', false); show('codeModal', false);
  mini.style.display = 'block'; hud.style.display = 'block';
  setScreen('game'); setBgm('game'); updateTouchUI();
  $('backBtn').textContent = soloMode ? 'タイトルに戻る ▶' : 'ロビーに戻る ▶';
  toast(myRole === 'runner' ? '逃げ側：消しゴムを探し、自分のエレベーターから脱出せよ！' : '鬼側：消しゴムを設置しよう！');
});

socket.on('ev', (m) => toast(m));
function toast(m) {
  const d = document.createElement('div'); d.textContent = m; $('toast').appendChild(d);
  setTimeout(() => d.remove(), 3600);
}

socket.on('state', (s) => {
  state = s;
  if (!inGame) return;
  TH = (2 - s.side) * Math.PI / 2;
  if (s.s === 'playing') ended = false;
  if (s.s !== 'playing' && !ended) {
    ended = true; resultShown = true;
    const runnerWin = s.s === 'runwin', iWin = (myRole === 'runner') === runnerWin;
    $('resTitle').textContent = iWin ? '勝利！' : '敗北…';
    $('resTitle').style.color = iWin ? '#4ade80' : '#f87171';
    $('resMsg').textContent = s.s === 'runwin' ? '脱出成功！' : 'ゲーム終了';
    show('result', true); mapOpen = false; fm.style.display = 'none';

const CHATS = ['👍', '😂', '😱', '🙏', '🔥', '❤️', '👀', '💤', 'こっちに逃げて！', '鬼が来る！', '消しゴム発見！', '助けて！', 'ありがとう！', 'ナイス！', '待って！', '急げ！'];

const RULE_DEF = [
  { k: 'matchTime', lab: '試合時間', min: 120, max: 600, st: 30, u: '秒' },
  { k: 'placeTime', lab: '設置時間', min: 10, max: 60, st: 5, u: '秒' },
  { k: 'runnerSpeed', lab: '逃げ側の速度', min: 70, max: 150, st: 5, u: '%' },
  { k: 'oniSpeed', lab: '鬼の速度', min: 70, max: 150, st: 5, u: '%' }
];
const RULE_TG = [{ k: 'items', lab: '🎁 アイテム' }, { k: 'potions', lab: '🧪 回復薬' }, { k: 'warps', lab: '🌀 ワープ' }, { k: 'crouch', lab: '🫥 しゃがみ' }];
const RULE_DEFAULT = { matchTime: 300, placeTime: 30, runnerSpeed: 100, oniSpeed: 100, items: true, potions: true, warps: true, crouch: true };
let rulesDraft = null;

function buildRules() {
  const host = !!(lobbyData && lobbyData.host === lobbyData.you), box = $('rulesBody'); box.innerHTML = '';
  $('rulesNote').textContent = host ? 'ホストだけが変更できます。' : 'ホストが設定したルールです。';
  $('rulesApply').style.display = host ? '' : 'none'; $('rulesReset').style.display = host ? '' : 'none';
  for (const d of RULE_DEF) {
    const row = document.createElement('div'); row.className = 'row';
    const lab = document.createElement('span'); lab.style.width = '110px'; lab.textContent = d.lab;
    const inp = document.createElement('input'); inp.type = 'range'; inp.min = d.min; inp.max = d.max; inp.step = d.st; inp.value = rulesDraft[d.k]; inp.disabled = !host;
    const val = document.createElement('span'); val.className = 'val'; val.style.width = '70px'; val.textContent = rulesDraft[d.k] + d.u;
    inp.addEventListener('input', () => { rulesDraft[d.k] = Number(inp.value); val.textContent = inp.value + d.u; });
    row.append(lab, inp, val); box.appendChild(row);
  }
  const tg = document.createElement('div'); tg.className = 'tgrow';
  for (const d of RULE_TG) {
    const b = document.createElement('button'); b.className = 'btn gray' + (rulesDraft[d.k] ? ' active' : ''); b.textContent = d.lab + '：' + (rulesDraft[d.k] ? 'ON' : 'OFF'); b.disabled = !host;
    b.onclick = () => { rulesDraft[d.k] = !rulesDraft[d.k]; buildRules(); };
    tg.appendChild(b);
  }
  box.appendChild(tg);
}
$('rulesBtn').onclick = () => { if (!lobbyData) return; rulesDraft = Object.assign({}, RULE_DEFAULT, lobbyData.rules); buildRules(); show('rules', true); };
$('rulesApply').onclick = () => { socket.emit('setRules', rulesDraft); show('rules', false); toast('⚙ ルールを更新した'); };
$('rulesReset').onclick = () => { rulesDraft = Object.assign({}, RULE_DEFAULT); buildRules(); };
$('rulesClose').onclick = () => show('rules', false);

$('backBtn').onclick = () => {
  if (soloMode) { socket.emit('leave'); goTitle(); }
  else { socket.emit('backToLobby'); leaveResult(); }
};
function leaveResult() { inGame = false; resultShown = false; show('result', false); hideGameUI(); if (lobbyData) { show('lobby', true); setScreen('lobby'); setBgm('lobby'); renderLobby(); } }
function goTitle() { inGame = false; resultShown = false; lobbyData = null; show('result', false); hideGameUI(); show('lobby', false); show('title', true); setScreen('title'); setBgm('lobby'); }

const doAction = () => socket.emit('action');
const doItem = () => socket.emit('useItem');
const doCrouch = () => socket.emit('crouch');
$('placeBtn').onclick = doAction;
$('itemBtn').onclick = doItem;

const keys = { u: 0, d: 0, l: 0, r: 0 };
const kmap = { KeyW: 'u', ArrowUp: 'u', KeyS: 'd', ArrowDown: 'd', KeyA: 'l', ArrowLeft: 'l', KeyD: 'r', ArrowRight: 'r' };
function sendInput() {
  const sx = keys.r - keys.l, sy = keys.d - keys.u;
  const c = Math.round(Math.cos(TH)), s = Math.round(Math.sin(TH));
  const wx = sx * c + sy * s, wy = -sx * s + sy * c;
  socket.emit('input', { u: wy < 0, d: wy > 0, l: wx < 0, r: wx > 0 });
}
function toggleMap() { if (!inGame) return; mapOpen = !mapOpen; fm.style.display = mapOpen ? 'block' : 'none'; }
fm.addEventListener('click', toggleMap);
addEventListener('keydown', (e) => {
  if (e.target && e.target.tagName === 'INPUT' && e.target.type !== 'range') return;
  if (e.code === 'Escape') { show('settings', false); if (mapOpen) toggleMap(); return; }
  if (e.code === 'KeyT') { toggleChat(); return; }
  if (!inGame) return;
  if (e.code === 'Space') { e.preventDefault(); doAction(); return; }
  if (e.code === 'KeyQ' || e.code === 'KeyE') { doItem(); return; }
  if (e.code === 'KeyM') { toggleMap(); return; }
  if (e.code === 'ShiftLeft' || e.code === 'ShiftRight' || e.code === 'KeyC') { doCrouch(); return; }
  const k = kmap[e.code]; if (!k) return;
  e.preventDefault();
  if (!keys[k]) { keys[k] = 1; sendInput(); }
});
addEventListener('keyup', (e) => {
  const k = kmap[e.code]; if (!k || !inGame) return;
  e.preventDefault();
  if (keys[k]) { keys[k] = 0; sendInput(); }
});

function updateTouchUI() {
  const on = settings.mode === 'ipad' && inGame;
  $('touch').style.display = on ? 'block' : 'none';
  document.body.classList.toggle('ipad', settings.mode === 'ipad');
}
const dpad = $('dpad'), knob = $('knob');
let dpId = null;
function setKeysVec(l, r, u, d) {
  const nk = { u: +u, d: +d, l: +l, r: +r };
  if (nk.u !== keys.u || nk.d !== keys.d || nk.l !== keys.l || nk.r !== keys.r) { Object.assign(keys, nk); if (inGame) sendInput(); }
}
function dpMove(e) {
  const r = dpad.getBoundingClientRect(), R = r.width / 2;
  let dx = e.clientX - (r.left + R), dy = e.clientY - (r.top + R);
  const d = Math.hypot(dx, dy);
  if (d > R) { dx *= R / d; dy *= R / d; }
  knob.style.transform = 'translate(' + dx + 'px,' + dy + 'px)';
  const th = R * 0.28;
  setKeysVec(dx < -th, dx > th, dy < -th, dy > th);
}
dpad.addEventListener('pointerdown', (e) => { e.preventDefault(); initAudio(); dpId = e.pointerId; dpMove(e); });
dpad.addEventListener('pointermove', (e) => { if (e.pointerId === dpId) { e.preventDefault(); dpMove(e); } });
const dpEnd = (e) => { if (e.pointerId !== dpId) return; dpId = null; knob.style.transform = ''; setKeysVec(0, 0, 0, 0); };
dpad.addEventListener('pointerup', dpEnd); dpad.addEventListener('pointercancel', dpEnd);

function buildMaze() {
  const { grid, T, N, map: M } = world;
  mazeCanvas = document.createElement('canvas'); mazeCanvas.width = M; mazeCanvas.height = M;
  const c = mazeCanvas.getContext('2d');
  c.fillStyle = '#20232c'; c.fillRect(0, 0, M, M);
  for (let y = 0; y < N; y++) for (let x = 0; x < N; x++) {
    if (grid[y][x] === '1') {
      c.fillStyle = '#6b7280'; c.fillRect(x * T, y * T, T, T);
      c.fillStyle = '#4b5563'; c.fillRect(x * T + 4, y * T + 4, T - 8, T - 8);
    } else { c.fillStyle = ((x + y) % 2) ? '#c9b99a' : '#bfae8e'; c.fillRect(x * T, y * T, T, T); }
  }
}

function smooth(cur, tgt, k) { cur.x += (tgt.x - cur.x) * k; cur.y += (tgt.y - cur.y) * k; }
function motion(v, tgt, k, dt) {
  const ox = v.x, oy = v.y;
  v.x += (tgt.x - v.x) * k; v.y += (tgt.y - v.y) * k;
  const mx = v.x - ox, my = v.y - oy, sp = Math.hypot(mx, my) / Math.max(dt, 0.001);
  v.mv = sp > 25 ? 1 : 0; v.ph = (v.ph || 0) + (v.mv ? sp * dt * 0.07 : 0);
  const sx = mx * Math.cos(TH) - my * Math.sin(TH);
  if (Math.abs(sx) > 0.3) v.fx = sx > 0 ? 1 : -1;
}
function withWorld(fn, zoom, cx, cy, fx, fy) {
  ctx.save();
  ctx.translate(cx === undefined ? VW / 2 + SX : cx, cy === undefined ? VH / 2 + SY : cy);
  ctx.scale(zoom || ZOOM(), zoom || ZOOM()); ctx.rotate(TH);
  ctx.translate(-(fx === undefined ? camV.x : fx), -(fy === undefined ? camV.y : fy));
  fn(); ctx.restore();
}
function w2s(x, y) {
  const dx = x - camV.x, dy = y - camV.y, c = Math.cos(TH), s = Math.sin(TH);
  return { x: VW / 2 + SX + (dx * c - dy * s) * ZOOM(), y: VH / 2 + SY + (dx * s + dy * c) * ZOOM() };
}
function rr(c, x, y, w, h, r) {
  c.beginPath(); c.moveTo(x + r, y); c.arcTo(x + w, y, x + w, y + h, r); c.arcTo(x + w, y + h, x, y + h, r); c.arcTo(x, y + h, x, y, r); c.arcTo(x, y, x + w, y, r); c.closePath();
}
function drawMono(c, sc) {
  c.save(); c.scale(sc, sc);
  c.fillStyle = '#f8fafc'; rr(c, -19, -9, 38, 18, 3); c.fill();
  c.strokeStyle = '#94a3b8'; c.lineWidth = 1; c.stroke();
  c.fillStyle = '#1d4ed8'; c.fillRect(-12, -9, 24, 6);
  c.fillStyle = '#ffffff'; c.fillRect(-12, -3, 24, 6);
  c.fillStyle = '#0b0b0b'; c.fillRect(-12, 3, 24, 6);
  c.fillStyle = '#1d4ed8'; c.font = 'bold 5.5px sans-serif'; c.textAlign = 'center'; c.textBaseline = 'middle'; c.fillText('MONO', 0, 0.3);
  c.strokeStyle = '#0f172a'; c.lineWidth = 1; c.strokeRect(-12, -9, 24, 18);
  c.restore();
}
function metalPanel(x, y, w, h) {
  const g = ctx.createLinearGradient(x, 0, x + w, 0);
  g.addColorStop(0, '#6b7280'); g.addColorStop(0.45, '#d1d5db'); g.addColorStop(0.55, '#9ca3af'); g.addColorStop(1, '#4b5563');
  ctx.fillStyle = g; ctx.fillRect(x, y, w, h);
}
function drawElevator(i, el, now, owned, showOpen) {
  const E = world.elevs[i], T = world.T, cx = E.tx * T + T / 2, cy = E.ty * T + T / 2;
  const door = showOpen ? el.door : 0, open = showOpen && el.open;
  ctx.save(); ctx.translate(cx, cy); ctx.rotate((i - 2) * Math.PI / 2); ctx.translate(-T / 2, -T / 2);
  const ig = ctx.createLinearGradient(0, 0, 0, T);
  ig.addColorStop(0, '#fff7d6'); ig.addColorStop(1, '#b59a63');
  ctx.fillStyle = ig; ctx.fillRect(0, 0, T, T);
  const half = T / 2, off = door * half;
  ctx.save(); ctx.beginPath(); ctx.rect(0, 0, T, T); ctx.clip();
  metalPanel(-off, 0, half, T); metalPanel(half + off, 0, half, T);
  ctx.restore();
  ctx.strokeStyle = owned ? '#22d3ee' : '#111827'; ctx.lineWidth = owned ? 7 : 6; ctx.strokeRect(3, 3, T - 6, T - 6);
  ctx.restore();
}
function drawPads(now) {
  world.pads.forEach((p, i) => {
    const col = PADCOL[p.pair];
    ctx.save(); ctx.translate(p.x, p.y);
    const g = ctx.createRadialGradient(0, 0, 4, 0, 0, 34);
    g.addColorStop(0, col); g.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(0, 0, 34, 0, 7); ctx.fill();
    ctx.restore();
  });
}
function drawChests(now) {
  world.chests.forEach((c, i) => {
    const open = state.ch && state.ch[i];
    ctx.save(); ctx.translate(c.x, c.y); ctx.rotate(-TH); ctx.globalAlpha = open ? 0.4 : 1;
    ctx.fillStyle = '#92400e'; ctx.fillRect(-16, -6, 32, 18);
    ctx.restore();
  });
}
function drawPotions(now) {
  world.potions.forEach((p, i) => {
    if (state.pt && state.pt[i]) return;
    ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(-TH);
    ctx.font = '26px sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText('🧪', 0, -2);
    ctx.restore();
  });
}

function limb(x0, y0, x1, y1, w, col) { ctx.strokeStyle = col; ctx.lineWidth = w; ctx.lineCap = 'round'; ctx.beginPath(); ctx.moveTo(x0, y0); ctx.lineTo(x1, y1); ctx.stroke(); }
function drawHuman(e, v, alpha, isMe, now) {
  const isOni = e.role === 'oni', sk = SKINS[e.sk || 0];
  ctx.save(); ctx.translate(v.x, v.y); ctx.rotate(-TH);
  ctx.globalAlpha = (e.iv || e.cr) ? alpha * 0.38 : alpha;
  if (e.al === false && !isOni) {
    ctx.strokeStyle = '#9ca3af'; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.moveTo(-9, -9); ctx.lineTo(9, 9); ctx.moveTo(9, -9); ctx.lineTo(-9, 9); ctx.stroke();
    ctx.restore(); return;
  }
  const fx = v.fx || 1, sw = v.mv ? Math.sin(v.ph || 0) : 0;
  const bob = v.mv ? Math.abs(Math.cos(v.ph || 0)) * 1.6 : Math.sin(now / 420) * 0.6;
  const skin = isOni ? (e.st ? '#9ca3af' : '#f87171') : '#f5cfa8';
  const shirt = isOni ? (e.st ? '#6b7280' : sk.o) : sk.c;
  ctx.save(); ctx.scale(fx, e.cr ? 0.78 : 1); ctx.translate(0, -bob + (e.cr ? 4 : 0));
  const pants = isOni ? '#facc15' : '#334155';
  limb(-4, 1, -4 + sw * 6, 12, 5, pants); limb(4, 1, 4 - sw * 6, 12, 5, pants);
  ctx.fillStyle = shirt; rr(ctx, -8.5, -17, 17, 19, 4); ctx.fill();
  ctx.fillStyle = skin; ctx.beginPath(); ctx.arc(0, -25, 9, 0, 7); ctx.fill();
  ctx.restore();
  ctx.globalAlpha = alpha * 0.9; ctx.fillStyle = '#fff'; ctx.font = '12px sans-serif'; ctx.textAlign = 'center';
  ctx.fillText(e.n || '', 0, 28);
  ctx.restore();
}

function frame(now) {
  requestAnimationFrame(frame);
  const dt = Math.min((performance.now() - last) / 1000, 0.1); last = performance.now();
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.fillStyle = '#000'; ctx.fillRect(0, 0, VW, VH);
  if (!inGame || !world || !state) return;

  const k = 1 - Math.exp(-dt * 30);
  if (!camV) camV = { x: state.cam.x, y: state.cam.y };
  if (!meV) meV = { x: state.me.x, y: state.me.y, ph: 0, fx: 1, mv: 0 };
  smooth(camV, state.cam, k); motion(meV, state.me, k, dt);
  const seen = {};
  for (const e of state.ents) { seen[e.id] = 1; if (!views[e.id]) views[e.id] = { x: e.x, y: e.y, ph: 0, fx: 1, mv: 0 }; motion(views[e.id], e, k, dt); }
  for (const id in views) if (!seen[id]) delete views[id];

  const el = state.el, T = world.T, Z = ZOOM(), lightR = cfg.lightR[myRole];

  withWorld(() => {
    ctx.drawImage(mazeCanvas, 0, 0);
    drawPads(now); drawChests(now); drawPotions(now);
    for (let i = 0; i < 4; i++) { const owned = i === state.side; drawElevator(i, el, now, owned, myRole === 'oni' || owned); }
    if (state.er && !state.er.c) {
      ctx.save(); ctx.translate(state.er.x, state.er.y); ctx.rotate(-TH);
      drawMono(ctx, 1.15); ctx.restore();
    }
    for (const e of state.ents) {
      const v = views[e.id];
      drawHuman(e, v, 1, false, now);
    }
    if (state.me.al || myRole === 'oni') drawHuman({ role: myRole, al: true, e: state.me.e, st: state.me.st, inv: state.me.inv, id: socket.id, n: myName, sk: mySkin, hp: state.me.hp }, meV, 1, true, now);
  });
}
requestAnimationFrame(frame);
