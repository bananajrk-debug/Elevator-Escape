<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>消しゴム奪取＆エレベーター脱出</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; font-family: "Hiragino Sans", "Meiryo", "Noto Sans JP", sans-serif; color: #fff; user-select: none; }
  canvas#game { display: block; width: 100vw; height: 100vh; }
  #mini { position: fixed; top: 12px; right: 12px; width: 160px; height: 160px; border: 2px solid #888; background: #111; display: none; border-radius: 6px; }
  #hud { position: fixed; top: 12px; left: 12px; font-size: 14px; text-shadow: 0 0 4px #000; display: none; line-height: 1.6; z-index: 2; }
  #toast { position: fixed; bottom: 40px; left: 50%; transform: translateX(-50%); text-align: center; pointer-events: none; z-index: 25; }
  #toast div { background: rgba(0,0,0,.8); padding: 8px 16px; margin-top: 6px; border-radius: 8px; font-size: 15px; font-weight: 800; border: 1px solid #ffd23f; }
  #banner { position: fixed; top: 70px; left: 50%; transform: translateX(-50%); font-size: 20px; font-weight: 800; text-align: center; text-shadow: 0 0 8px #000; display: none; pointer-events: none; z-index: 2; }

  .overlay { position: fixed; inset: 0; display: none; z-index: 10; }
  .btn { border: none; color: #fff; cursor: pointer; font-weight: 900; font-family: inherit; border-radius: 12px; transition: transform .08s, box-shadow .08s; letter-spacing: 1px; }
  .btn:active { transform: translateY(3px); }
  .btn:disabled { opacity: .45; cursor: default; }
  .btn.yellow { background: #ffd23f; color: #3a2a00; box-shadow: 0 5px 0 #c79a00; }
  .btn.blue { background: #2f8cff; box-shadow: 0 5px 0 #1457b3; }
  .btn.gray { background: #4b5568; box-shadow: 0 4px 0 #2b3342; }
  .btn.red { background: #ef4444; box-shadow: 0 5px 0 #a11d1d; }
  .bg { background: radial-gradient(circle at 50% 35%, #5b3cc4 0%, #2a1a6e 45%, #120a33 100%); overflow: hidden; }

  /* 右側 20% (5分の1) サイドドロワーメニュー */
  #menuDrawer { position: fixed; top: 0; right: 0; width: 20vw; min-width: 260px; height: 100vh; background: #120c36; border-left: 3px solid #ffd23f; z-index: 30; display: none; flex-direction: column; padding: 16px; box-shadow: -10px 0 30px rgba(0,0,0,.6); }
  #menuDrawer .d-head { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid rgba(255,255,255,.1); padding-bottom: 10px; margin-bottom: 12px; }
  #menuDrawer .d-tabs { display: flex; gap: 6px; margin-bottom: 12px; }
  #menuDrawer .d-tabs .btn { flex: 1; padding: 8px 4px; font-size: 13px; }
  #menuDrawer .d-body { flex: 1; overflow-y: auto; font-size: 13px; }

  /* 画面 中央 60% (5分の3, 左右20%あき) モーダル (ショップ・クエスト・実績・ルール) */
  .modal-60 { position: fixed; top: 50%; left: 20vw; width: 60vw; height: 80vh; transform: translateY(-50%); background: #1a1540; border: 4px solid #ffd23f; border-radius: 20px; z-index: 28; display: none; flex-direction: column; padding: 20px; box-shadow: 0 0 50px rgba(0,0,0,.8); }
  .modal-60 .m-head { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid rgba(255,255,255,.1); padding-bottom: 10px; margin-bottom: 14px; }
  .modal-60 .m-body { flex: 1; overflow-y: auto; }

  /* ショップ：スキンが大きめのカードで横並び */
  .shop-cards { display: flex; gap: 16px; overflow-x: auto; padding: 12px 4px; }
  .skin-card { flex: 0 0 180px; height: 260px; background: #262058; border: 3px solid rgba(255,255,255,.2); border-radius: 16px; display: flex; flex-direction: column; align-items: center; justify-content: space-between; padding: 14px; position: relative; }
  .skin-card.owned { border-color: #38bdf8; }
  .skin-card.selected { border-color: #ffd23f; box-shadow: 0 0 20px #ffd23f; }
  .skin-card .sc-title { font-weight: 900; font-size: 16px; color: #ffe58a; text-align: center; }
  .skin-card .sc-prev { width: 80px; height: 80px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 36px; margin: 10px 0; border: 4px solid #fff; }
  .skin-card .sc-price { font-weight: 800; font-size: 15px; color: #ffd23f; }

  /* タイトル */
  #title { align-items: center; justify-content: center; flex-direction: column; text-align: center; }
  .tlogo { font-size: clamp(38px, 8vmin, 80px); font-weight: 900; font-style: italic; color: transparent; -webkit-text-stroke: 4px #1b0f4d; paint-order: stroke fill; background: linear-gradient(180deg, #fffbe0 8%, #ffd23f 46%, #ff8a00 100%); -webkit-background-clip: text; background-clip: text; }
  .center { display: flex; flex-direction: column; align-items: center; gap: 12px; width: min(90vw, 420px); margin-top: 20px; }
  .field { width: 100%; font-size: 18px; font-weight: 800; padding: 12px; border-radius: 12px; border: 3px solid #1b0f4d; text-align: center; font-family: inherit; }
  .joinrow { display: flex; gap: 8px; width: 100%; }

  /* ロビー・カウントダウン */
  #codePill { position: absolute; top: 14px; right: 16px; background: rgba(10,6,32,.8); border: 2px solid #ffd23f; border-radius: 12px; padding: 6px 16px; text-align: center; cursor: pointer; }
  #stageCv { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
  #cntOverlay { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; z-index: 40; background: rgba(0,0,0,.4); pointer-events: none; }
  #cntNum { font-size: 140px; font-weight: 900; font-style: italic; color: #ffd23f; -webkit-text-stroke: 4px #1b0f4d; text-shadow: 0 0 30px #ff8a00; animation: pop .4s ease-out; }
  @keyframes pop { from { transform: scale(0.3); opacity: 0; } to { transform: scale(1); opacity: 1; } }

  /* タッチパネル */
  #touch { display: none; }
  #dpad { position: fixed; left: 20px; bottom: 20px; width: 150px; height: 150px; border-radius: 50%; background: rgba(255,255,255,.15); border: 2px solid rgba(255,255,255,.4); touch-action: none; z-index: 12; }
  #knob { position: absolute; left: 50%; top: 50%; width: 50px; height: 50px; margin: -25px 0 0 -25px; border-radius: 50%; background: rgba(255,255,255,.6); pointer-events: none; }
  .tb { position: fixed; border-radius: 50%; border: 2px solid rgba(255,255,255,.6); background: rgba(40,40,80,.6); color: #fff; font-weight: 900; display: flex; align-items: center; justify-content: center; touch-action: none; z-index: 12; }
  #tbSpace { right: 20px; bottom: 20px; width: 90px; height: 90px; font-size: 16px; background: rgba(255,210,63,.6); }
  #tbQ { right: 120px; bottom: 30px; width: 65px; height: 65px; font-size: 16px; }
  #tbCrouch { right: 20px; bottom: 120px; width: 65px; height: 65px; font-size: 13px; background: rgba(16,185,129,.5); }
  #tbMap { right: 100px; bottom: 110px; width: 50px; height: 50px; font-size: 12px; }

  #gear, #menuBtn, #shopNavBtn { position: fixed; top: 12px; z-index: 15; width: 44px; height: 44px; font-size: 20px; padding: 0; border-radius: 50%; }
  #gear { right: 12px; }
  #menuBtn { right: 64px; }
  #shopNavBtn { right: 116px; }

  .fl-row { display: flex; gap: 6px; margin: 8px 0; align-items: center; }
  .field2 { flex: 1; padding: 8px; border-radius: 8px; border: 2px solid #1b0f4d; font-weight: 800; font-size: 13px; }
  #fullmap { position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%); width: min(80vh, 88vw); height: min(80vh, 88vw); display: none; z-index: 20; border: 4px solid #ffd23f; border-radius: 12px; background: #080614; }
</style>
</head>
<body>
<canvas id="game"></canvas>
<canvas id="mini" width="160" height="160"></canvas>
<div id="hud"></div>
<div id="banner"></div>
<div id="toast"></div>

<!-- ナビボタン -->
<button id="gear" class="btn gray">⚙</button>
<button id="menuBtn" class="btn gray">☰</button>
<button id="shopNavBtn" class="btn yellow">🛒</button>

<canvas id="fullmap" width="640" height="640"></canvas>

<!-- カウントダウンオーバーレイ -->
<div id="cntOverlay"><div id="cntNum">3</div></div>

<!-- タッチ操作 UI -->
<div id="touch">
  <div id="dpad"><div id="knob"></div></div>
  <div class="tb" id="tbQ">Q</div>
  <div class="tb" id="tbSpace">SPACE</div>
  <div class="tb" id="tbCrouch">しゃがみ</div>
  <div class="tb" id="tbMap">MAP</div>
</div>

<!-- 右側 20% (5分の1) サイドドロワーメニュー (☰) -->
<div id="menuDrawer">
  <div class="d-head"><span style="font-size:18px;font-weight:900;color:#ffd23f">☰ メニュー</span><button id="menuClose" class="btn gray" style="padding:4px 10px">✕</button></div>
  <div class="d-tabs">
    <button class="btn yellow" id="tabAccBtn">アカウント</button>
    <button class="btn gray" id="tabFrBtn">フレンド</button>
  </div>
  <div class="d-body">
    <div id="tabAcc">
      <div id="accStatus" style="margin-bottom:8px;line-height:1.4"></div>
      <div class="fl-row"><input id="accName" class="field2" placeholder="ユーザー名 (2〜12文字)"><button id="accSave" class="btn yellow" style="padding:6px 10px;font-size:12px">登録</button></div>
      <div style="font-size:11px;color:#cbd5e1;margin-top:10px"><b>ログインキー</b> (別端末への引き継ぎ)</div>
      <div class="fl-row"><input id="keyVal" class="field2" readonly placeholder="キー非表示"><button id="keyShow" class="btn gray" style="padding:6px 8px;font-size:11px">表示</button></div>
      <div class="fl-row"><input id="loginKey" class="field2" placeholder="キー貼り付け"><button id="loginBtn" class="btn blue" style="padding:6px 8px;font-size:11px">ログイン</button></div>
      <div id="accMsg" style="color:#ffd23f;font-weight:800;margin-top:6px"></div>
    </div>
    <div id="tabFr" style="display:none">
      <div style="font-weight:800;margin-bottom:4px">フレンド申請</div>
      <div class="fl-row"><input id="frName" class="field2" placeholder="相手のユーザー名"><button id="frAdd" class="btn yellow" style="padding:6px 10px;font-size:12px">申請</button></div>
      <div id="frMsg" style="color:#ffd23f;font-weight:800;margin-bottom:10px"></div>
      <div style="font-weight:800;margin-bottom:4px">フレンド一覧・承認待ち</div>
      <div id="frList"></div>
    </div>
  </div>
</div>

<!-- 中央 60% (5分の3, 左右20%あき) モーダル (ショップ & クエスト/実績) -->
<div id="shopModal" class="modal-60">
  <div class="m-head">
    <span style="font-size:22px;font-weight:900;color:#ffd23f">🛒 スキンショップ & 🏆 実績/クエスト</span>
    <div><span id="shopEg" style="font-size:18px;font-weight:900;color:#ffd23f;margin-right:16px">0 EG</span><button id="shopClose" class="btn gray" style="padding:6px 14px">✕</button></div>
  </div>
  <div class="m-body">
    <div style="font-weight:900;font-size:16px;margin-bottom:6px">■ スキンショップ (一律 50 EG)</div>
    <div class="shop-cards" id="shopCards"></div>
    <div style="font-weight:900;font-size:16px;margin:20px 0 6px">■ 実績 & クエスト (称号ゲット)</div>
    <div id="achList" style="display:grid;grid-template-columns:1fr 1fr;gap:10px"></div>
  </div>
</div>

<!-- タイトル画面 -->
<div id="title" class="overlay bg" style="display:flex">
  <div class="tlogo">消しゴム奪取</div>
  <div style="font-size:18px;font-weight:900;color:#fde047;letter-spacing:2px">＆ エレベーター脱出</div>
  <div class="center">
    <input id="name" class="field" maxlength="12" placeholder="プレイヤー名を入力">
    <button id="btnCreate" class="btn yellow" style="width:100%;font-size:22px;padding:16px">🏠 ルームを作る</button>
    <div style="display:flex;gap:8px;width:100%">
      <select id="soloFloors" class="field" style="width:110px;font-size:15px;padding:8px"><option value="1">1階戦</option><option value="3" selected>3階戦</option><option value="5">5階戦</option></select>
      <button id="btnSolo" class="btn blue" style="flex:1;font-size:18px;padding:12px">🤖 CPUと戦う</button>
    </div>
    <div class="joinrow">
      <input id="code" class="field" inputmode="numeric" maxlength="5" placeholder="5桁コード">
      <button id="btnJoin" class="btn gray" style="font-size:16px;padding:0 20px">参加</button>
    </div>
    <div id="err" style="color:#ff9aa2;font-weight:800;min-height:20px"></div>
  </div>
</div>

<!-- ロビー画面 -->
<div id="lobby" class="overlay bg">
  <div style="position:absolute;top:14px;left:16px;display:flex;gap:8px">
    <button id="leave" class="btn gray" style="padding:8px 16px">◀ 退出</button>
    <button id="rulesBtn" class="btn gray" style="padding:8px 16px">⚙ ルール</button>
  </div>
  <div id="codePill"><div style="font-size:10px;color:#ffd23f">ROOM CODE</div><div id="codeNum" style="font-size:28px;font-weight:900">-----</div></div>
  <canvas id="stageCv"></canvas>
  <div style="position:absolute;bottom:20px;left:20px;display:flex;gap:8px">
    <button class="btn gray" data-role="runner">🏃 逃げ側</button>
    <button class="btn gray" data-role="oni">👹 鬼側</button>
    <button class="btn gray" data-role="auto">🎲 おまかせ</button>
  </div>
  <button id="start" class="btn yellow" style="position:absolute;bottom:20px;right:20px;font-size:24px;padding:14px 36px">ゲーム開始 ▶</button>
  <button id="readyBtn" class="btn blue" style="position:absolute;bottom:20px;right:20px;font-size:24px;padding:14px 36px;display:none">準備OK ✓</button>
</div>

<!-- 設定モーダル -->
<div id="settings" class="overlay" style="background:rgba(0,0,0,.8);align-items:center;justify-content:center">
  <div style="background:#1e1b4b;border:3px solid #ffd23f;border-radius:16px;padding:20px;width:min(90vw,400px)">
    <h3 style="margin:0 0 12px;color:#ffd23f">⚙ 設定</h3>
    <div class="fl-row"><span style="width:80px">BGM</span><input type="range" id="setBgm" min="0" max="100"></div>
    <div class="fl-row"><span style="width:80px">SE</span><input type="range" id="setSe" min="0" max="100"></div>
    <div style="display:flex;gap:8px;margin-top:14px">
      <button class="btn gray" id="modePc" style="flex:1;padding:8px">🖥 PC操作</button>
      <button class="btn gray" id="modePad" style="flex:1;padding:8px">📱 iPad/Pad</button>
    </div>
    <div style="text-align:center;margin-top:16px"><button class="btn yellow" id="setClose" style="padding:8px 24px">閉じる</button></div>
  </div>
</div>

<!-- ラウンド/マッチ結果モーダル -->
<div id="result" class="overlay" style="background:rgba(0,0,0,.85);align-items:center;justify-content:center;flex-direction:column;text-align:center">
  <h1 id="resTitle" style="font-size:48px;margin:0 0 10px"></h1>
  <div id="resSub" style="font-size:18px;color:#ddd;margin-bottom:16px"></div>
  <div id="resStandings" style="width:min(90vw,440px);background:#231d54;border-radius:12px;padding:12px;margin-bottom:20px"></div>
  <button id="backBtn" class="btn yellow" style="font-size:22px;padding:12px 36px">次へ ▶</button>
</div>

<script src="/socket.io/socket.io.js"></script>
<script>
const socket = io();
const $ = (id) => document.getElementById(id);
const cv = $('game'), ctx = cv.getContext('2d');
const mini = $('mini'), mctx = mini.getContext('2d');
const fm = $('fullmap'), fctx = fm.getContext('2d');
const stageCv = $('stageCv'), sctx = stageCv.getContext('2d');

let world = null, cfg = null, mazeCanvas = null, state = null, inGame = false;
let myRole = 'runner', myName = '', lobbyData = null, TH = 0, mySkin = 0, catalog = null;
let profile = { name: null, wallet: null }, friendsData = { list: [], reqIn: [], reqOut: [] };
let views = {}, camV = null, meV = null, fxs = [], mapOpen = false, oniDots = [];
let keys = { u: 0, d: 0, l: 0, r: 0 };
let DPR = 1, VW = innerWidth, VH = innerHeight;

// 1端末1アカウント識別ID (LocalStorage)
let deviceId = localStorage.getItem('eg_device_id');
if (!deviceId) {
  deviceId = 'dev_' + Math.random().toString(36).substring(2, 15) + Date.now().toString(36);
  localStorage.setItem('eg_device_id', deviceId);
}
let myToken = localStorage.getItem('ptoken') || '';

const SKINS = [
  { n: 'スカイ', c: '#3b82f6', r: '#ffffff', m: '' },
  { n: 'ミント', c: '#10b981', r: '#d1fae5', m: '♪' },
  { n: 'サンセット', c: '#f97316', r: '#fff7ed', m: '☀' },
  { n: 'ベリー', c: '#ec4899', r: '#ffffff', m: '♥' },
  { n: 'ライム', c: '#84cc16', r: '#1a2e05', m: '★' },
  { n: 'バイオレット', c: '#8b5cf6', r: '#ede9fe', m: '☾' },
  { n: 'ゴールド', c: '#eab308', r: '#422006', m: '⚡' },
  { n: 'モノクロ', c: '#e5e7eb', r: '#111827', m: '☻' }
];

let settings = { bgm: 0.5, se: 0.8, mode: 'pc' };
try { Object.assign(settings, JSON.parse(localStorage.getItem('settings') || '{}')); } catch (e) {}

function toast(m) {
  const d = document.createElement('div'); d.textContent = m; $('toast').appendChild(d);
  setTimeout(() => d.remove(), 3200);
}
function show(id, on) { $(id).style.display = on ? 'flex' : 'none'; }

function resize() {
  DPR = Math.min(2, window.devicePixelRatio || 1);
  VW = innerWidth; VH = innerHeight;
  cv.width = Math.round(VW * DPR); cv.height = Math.round(VH * DPR);
  stageCv.width = Math.round(VW * DPR); stageCv.height = Math.round(VH * DPR);
}
addEventListener('resize', resize); resize();

// ---- ナビ・画面切替 ----
$('menuBtn').onclick = () => { $('menuDrawer').style.display = $('menuDrawer').style.display === 'flex' ? 'none' : 'flex'; };
$('menuClose').onclick = () => { $('menuDrawer').style.display = 'none'; };
$('shopNavBtn').onclick = () => { renderShop(); $('shopModal').style.display = 'flex'; };
$('shopClose').onclick = () => { $('shopModal').style.display = 'none'; };
$('gear').onclick = () => { show('settings', true); };
$('setClose').onclick = () => { show('settings', false); };

$('tabAccBtn').onclick = () => { $('tabAcc').style.display = 'block'; $('tabFr').style.display = 'none'; $('tabAccBtn').className = 'btn yellow'; $('tabFrBtn').className = 'btn gray'; };
$('tabFrBtn').onclick = () => { $('tabAcc').style.display = 'none'; $('tabFr').style.display = 'block'; $('tabAccBtn').className = 'btn gray'; $('tabFrBtn').className = 'btn yellow'; socket.emit('friends'); };

// ---- アカウント・ログイン ----
socket.on('connect', () => { if (myToken) socket.emit('auth', { token: myToken, device: deviceId }); });
socket.on('catalog', (c) => { catalog = c; });
socket.on('profile', (p) => {
  profile = p;
  if (p.name) {
    $('accStatus').innerHTML = '✅ ログイン中：<b style="color:#ffd23f">' + p.name + '</b>';
    $('accName').value = p.name;
  } else {
    $('accStatus').innerHTML = 'ユーザー名未登録（1端末1アカウント）';
  }
  if (p.wallet) $('shopEg').textContent = p.wallet.eg + ' EG';
});
socket.on('registered', (m) => { myToken = m.token; localStorage.setItem('ptoken', myToken); });
socket.on('accMsg', (m) => { $('accMsg').textContent = m.msg; });
socket.on('wallet', (w) => { if (profile) profile.wallet = w; $('shopEg').textContent = (w ? w.eg : 0) + ' EG'; renderShop(); });

$('accSave').onclick = () => {
  const name = $('accName').value.trim();
  if (profile.name) socket.emit('rename', { name });
  else socket.emit('register', { name, device: deviceId });
};
$('keyShow').onclick = () => { $('keyVal').value =$('keyVal').value ? '' : myToken; $('keyShow').textContent =$('keyVal').value ? '隠す' : '表示'; };
$('loginBtn').onclick = () => { socket.emit('loginKey', { token:$('loginKey').value.trim(), device: deviceId }); };

// ---- フレンド（申請・承認制）----
socket.on('friends', (f) => { friendsData = f; renderFriends(); });
socket.on('friendReq', (m) => { toast('📨 ' + m.from + ' さんからフレンド申請が届いた！'); socket.emit('friends'); });
socket.on('friendMsg', (m) => { $('frMsg').textContent = m.msg; socket.emit('friends'); });

$('frAdd').onclick = () => { socket.emit('friendRequest', { name: $('frName').value.trim() });$('frName').value = ''; };

function renderFriends() {
  const box = $('frList'); box.innerHTML = '';
  if (friendsData.reqIn && friendsData.reqIn.length) {
    box.innerHTML += '<div style="color:#ffd23f;font-weight:800;margin-top:6px">【届いた申請】</div>';
    friendsData.reqIn.forEach((name) => {
      box.innerHTML += `<div class="fl-row"><span>${name}</span>
        <button onclick="socket.emit('friendRespond',{name:'${name}',accept:true})" class="btn yellow" style="padding:4px 8px;font-size:11px">承認</button>
        <button onclick="socket.emit('friendRespond',{name:'${name}',accept:false})" class="btn gray" style="padding:4px 8px;font-size:11px">拒否</button></div>`;
    });
  }
  box.innerHTML += '<div style="color:#a7f3d0;font-weight:800;margin-top:8px">【フレンド一覧】</div>';
  if (!friendsData.list || !friendsData.list.length) box.innerHTML += '<div style="color:#94a3b8">フレンドはいません</div>';
  else {
    friendsData.list.forEach((f) => {
      const st = !f.online ? 'オフライン' : f.room ? (f.state === 'playing' ? '試合中' : 'ロビー') : 'オンライン';
      box.innerHTML += `<div class="fl-row" style="justify-content:space-between">
        <div><b>${f.name}</b> <small>(${st})</small></div>
        ${f.online && f.room ? `<button onclick="socket.emit('joinFriend',{name:'${f.name}'})" class="btn blue" style="padding:3px 8px;font-size:11px">参加</button>` : ''}
      </div>`;
    });
  }
}

// ---- ショップ・実績描画 ----
function renderShop() {
  const box = $('shopCards'), wallet = profile.wallet || { eg: 0, owned: [0,1,2], ach: [] };
  box.innerHTML = '';
  SKINS.forEach((sk, i) => {
    const owned = wallet.owned.includes(i), sel = mySkin === i;
    const card = document.createElement('div');
    card.className = 'skin-card' + (owned ? ' owned' : '') + (sel ? ' selected' : '');
    card.innerHTML = `
      <div class="sc-title">${sk.n}</div>
      <div class="sc-prev" style="background:${sk.c};color:${sk.r}">${sk.m || '●'}</div>
      <div class="sc-price">${owned ? (sel ? '装備中' : '所持済み') : '50 EG'}</div>
      <button class="btn ${owned ? 'blue' : 'yellow'}" style="width:100%;padding:6px;font-size:12px">${owned ? (sel ? '選択中' : '装備する') : '購入'}</button>
    `;
    card.querySelector('button').onclick = () => {
      if (owned) { mySkin = i; socket.emit('setSkin', i); renderShop(); }
      else socket.emit('buySkin', { id: i });
    };
    box.appendChild(card);
  });

  const achBox = $('achList'); achBox.innerHTML = '';
  if (catalog && catalog.ach) {
    catalog.ach.forEach((a) => {
      const done = wallet.ach && wallet.ach.includes(a.id);
      achBox.innerHTML += `
        <div style="background:#262058;padding:10px;border-radius:10px;border:1px solid ${done ? '#ffd23f' : '#475569'}">
          <div style="font-weight:900;color:${done ? '#ffd23f' : '#94a3b8'}">${done ? '🏆' : '🔒'} ${a.n} <small>(+${a.eg}EG)</small></div>
          <div style="font-size:12px;color:#cbd5e1">${a.d}</div>
          <div style="font-size:11px;color:#a7f3d0;margin-top:2px">称号: 「${a.t}」</div>
        </div>
      `;
    });
  }
}

// ---- タイトル & ロビー処理 ----
const nm = () => profile.name || $('name').value.trim() || 'プレイヤー';
$('btnCreate').onclick = () => socket.emit('create', { name: nm(), skin: mySkin });
$('btnSolo').onclick = () => socket.emit('solo', { name: nm(), skin: mySkin, floors:$('soloFloors').value });
$('btnJoin').onclick = () => socket.emit('join', { name: nm(), code:$('code').value, skin: mySkin });
$('leave').onclick = () => { socket.emit('leave'); show('lobby', false); show('title', true); inGame = false; };$('start').onclick = () => socket.emit('start');

document.querySelectorAll('#lobby [data-role]').forEach((b) => b.onclick = () => socket.emit('setRole', b.dataset.role));

socket.on('lobby', (d) => {
  lobbyData = d;
  if (inGame && d.state === 'playing') return;
  show('title', false); show('lobby', true);
  $('codeNum').textContent = d.code;
  const host = d.host === d.you;
  $('start').style.display = host ? 'block' : 'none';
  $('readyBtn').style.display = host ? 'none' : 'block';
  renderStage();
});

// フレンド（マルチ）カウントダウン演出：ロビー中央で 3, 2, 1, START!
socket.on('lobbyCount', (m) => {
  $('cntOverlay').style.display = 'flex';$('cntNum').textContent = m.n === 0 ? 'START!' : m.n;
  if (m.n === 0) setTimeout(() => { $('cntOverlay').style.display = 'none'; }, 800);
});

function renderStage() {
  sctx.clearRect(0, 0, VW, VH);
  if (!lobbyData) return;
  const ps = lobbyData.players, cx = VW / 2, cy = VH * 0.6;
  ps.forEach((p, i) => {
    const x = cx + (i - (ps.length - 1) / 2) * 80;
    sctx.fillStyle = SKINS[p.skin || 0].c;
    sctx.beginPath(); sctx.arc(x, cy, 24, 0, 7); sctx.fill();
    sctx.fillStyle = '#fff'; sctx.font = 'bold 14px sans-serif'; sctx.textAlign = 'center';
    sctx.fillText(p.name, x, cy - 34);
    if (p.title) sctx.fillText(`「${p.title}」`, x, cy - 50);
  });
}

// ---- ゲーム初期化 & 描画 ----
socket.on('init', (w) => {
  world = w; cfg = w.cfg; myRole = w.role; myName = w.name; mySkin = w.skin || 0;
  TH = (2 - w.side) * Math.PI / 2;
  buildMaze(); inGame = true;
  show('title', false); show('lobby', false); show('result', false);
  $('shopModal').style.display = 'none';$('menuDrawer').style.display = 'none';
  mini.style.display = 'block'; $('hud').style.display = 'block';
  if (settings.mode === 'ipad') $('touch').style.display = 'block';

  // CPU（ソロ）カウントダウン演出：ゲーム画面で 3, 2, 1, START!
  if (w.solo) {
    $('cntOverlay').style.display = 'flex';
    let n = 3;
    $('cntNum').textContent = n;
    const iv = setInterval(() => {
      n--;
      if (n > 0) $('cntNum').textContent = n;
      else if (n === 0) $('cntNum').textContent = 'START!';
      else { clearInterval(iv); $('cntOverlay').style.display = 'none'; }
    }, 800);
  }
});

function buildMaze() {
  const { grid, T, N, map: M } = world;
  mazeCanvas = document.createElement('canvas'); mazeCanvas.width = M; mazeCanvas.height = M;
  const c = mazeCanvas.getContext('2d');
  c.fillStyle = '#20232c'; c.fillRect(0, 0, M, M);
  for (let y = 0; y < N; y++) for (let x = 0; x < N; x++) {
    if (grid[y][x] === '1') {
      c.fillStyle = '#6b7280'; c.fillRect(x * T, y * T, T, T);
      c.fillStyle = '#4b5563'; c.fillRect(x * T + 4, y * T + 4, T - 8, T - 8);
    } else { c.fillStyle = ((x + y) % 2) ? '#c9b99a' : '#bfae8e'; c.fillRect(x * T, y * T, T, T); }
  }
}

socket.on('state', (s) => { state = s; TH = (2 - s.side) * Math.PI / 2; });
socket.on('ev', (m) => toast(m));

// ---- ラウンド / マッチ終了画面 ----
socket.on('roundEnd', (r) => {
  $('resTitle').textContent = r.status === 'runwin' ? '逃げ側 勝利！' : '鬼側 勝利！';
  $('resSub').textContent = `${r.floor} / ${r.total} 階層 ${r.sudden ? '(サドンデス)' : ''}`;
  let html = '<div style="font-weight:900;margin-bottom:8px">【スコア順位】</div>';
  r.standings.forEach((s) => {
    html += `<div style="display:flex;justify-space-between;margin:4px 0;${s.me ? 'color:#ffd23f' : ''}">
      <span>${s.name}</span><span>${s.pts} pt (+${s.delta})</span></div>`;
  });
  if (r.final) {
    html += `<div style="color:#4ade80;font-weight:900;margin-top:12px;border-top:1px solid #fff;padding-top:8px">
      優勝: ${r.final.winners.join(', ')} (+${r.final.egBonus} EG)</div>`;
  }
  $('resStandings').innerHTML = html;
  $('backBtn').textContent = r.done ? 'ロビーへ戻る ▶' : '次の階へ ▶';
  $('backBtn').onclick = () => {
    show('result', false);
    if (r.done) { socket.emit('backToLobby'); show('title', true); inGame = false; }
  };
  show('result', true);
});

// ---- 操作系 ----
function sendInput() {
  const sx = keys.r - keys.l, sy = keys.d - keys.u;
  const c = Math.round(Math.cos(TH)), s = Math.round(Math.sin(TH));
  const wx = sx * c + sy * s, wy = -sx * s + sy * c;
  socket.emit('input', { u: wy < 0, d: wy > 0, l: wx < 0, r: wx > 0 });
}
addEventListener('keydown', (e) => {
  if (e.target.tagName === 'INPUT') return;
  if (e.code === 'Space') { e.preventDefault(); socket.emit('action'); }
  if (e.code === 'KeyQ') socket.emit('useItem');
  if (e.code === 'KeyC' || e.code === 'ShiftLeft') socket.emit('crouch');
  if (e.code === 'KeyM') { mapOpen = !mapOpen; fm.style.display = mapOpen ? 'block' : 'none'; }
  const k = { KeyW:'u', ArrowUp:'u', KeyS:'d', ArrowDown:'d', KeyA:'l', ArrowLeft:'l', KeyD:'r', ArrowRight:'r' }[e.code];
  if (k && !keys[k]) { keys[k] = 1; sendInput(); }
});
addEventListener('keyup', (e) => {
  const k = { KeyW:'u', ArrowUp:'u', KeyS:'d', ArrowDown:'d', KeyA:'l', ArrowLeft:'l', KeyD:'r', ArrowRight:'r' }[e.code];
  if (k) { keys[k] = 0; sendInput(); }
});

// ---- メイン描画ループ (60fps) ----
function frame() {
  requestAnimationFrame(frame);
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.fillStyle = '#000'; ctx.fillRect(0, 0, VW, VH);
  if (!inGame || !world || !state) return;

  const ZOOM = cfg.zoom, T = world.T;
  if (!camV) camV = { x: state.cam.x, y: state.cam.y };
  camV.x += (state.cam.x - camV.x) * 0.1; camV.y += (state.cam.y - camV.y) * 0.1;

  ctx.save();
  ctx.translate(VW / 2, VH / 2); ctx.scale(ZOOM, ZOOM); ctx.rotate(TH); ctx.translate(-camV.x, -camV.y);
  ctx.drawImage(mazeCanvas, 0, 0);

  // シャー芯描画
  if (state.ld) {
    ctx.fillStyle = '#facc15';
    state.ld.forEach((l) => { ctx.fillRect(l.x - 4, l.y - 12, 8, 24); });
  }

  // エレベーター描画
  for (let i = 0; i < 4; i++) {
    const E = world.elevs[i], cx = E.tx * T + T / 2, cy = E.ty * T + T / 2;
    ctx.fillStyle = (state.el && state.el.open && i === state.side) ? '#22c55e' : '#6b7280';
    ctx.fillRect(cx - T / 2, cy - T / 2, T, T);
  }

  // プレイヤー描画
  for (const e of state.ents) {
    ctx.fillStyle = SKINS[e.sk || 0].c;
    ctx.beginPath(); ctx.arc(e.x, e.y, 18, 0, 7); ctx.fill();
    ctx.fillStyle = '#fff'; ctx.font = '12px sans-serif'; ctx.textAlign = 'center';
    ctx.fillText(e.n, e.x, e.y - 24);
  }

  // 自分の描画
  ctx.fillStyle = SKINS[mySkin].c;
  ctx.beginPath(); ctx.arc(state.me.x, state.me.y, 18, 0, 7); ctx.fill();
  ctx.strokeStyle = '#ffd23f'; ctx.lineWidth = 3; ctx.stroke();

  ctx.restore();

  // HUD更新
  let h = `<b>第 ${state.fl} / ${state.tf} 階層 ${state.sd ? '(サドンデス)' : ''}</b><br>`;
  h += `役割: ${myRole === 'oni' ? '👹 鬼' : '🏃 逃げ'} | 生存: ${state.n}人<br>`;
  h += `残り時間: ${Math.ceil(state.t)}秒 | スコア: ${state.me.pts} pt (シャー芯 ${state.me.leads}本)`;
  $('hud').innerHTML = h;
}
requestAnimationFrame(frame);
</script>
