<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>消しゴム奪取＆エレベーター脱出</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; font-family: "Hiragino Sans", "Meiryo", "Noto Sans JP", sans-serif; color: #fff; user-select: none; }
  canvas#game { display: block; width: 100vw; height: 100vh; }
  #mini { position: fixed; top: 12px; right: 12px; width: 160px; height: 160px; border: 2px solid #888; background: #111; display: none; border-radius: 6px; }
  #hud { position: fixed; top: 12px; left: 12px; font-size: 15px; text-shadow: 0 0 4px #000; display: none; line-height: 1.7; }
  #toast { position: fixed; bottom: 40px; left: 50%; transform: translateX(-50%); text-align: center; pointer-events: none; z-index: 3; }
  #toast div { background: rgba(0,0,0,.72); padding: 6px 14px; margin-top: 6px; border-radius: 6px; font-size: 16px; }
  #banner { position: fixed; top: 70px; left: 50%; transform: translateX(-50%); font-size: 20px; font-weight: 800; text-align: center; text-shadow: 0 0 8px #000; display: none; pointer-events: none; }
  #placeBtn { position: fixed; bottom: 90px; left: 50%; transform: translateX(-50%); display: none; z-index: 4; }
  #itemBtn { position: fixed; bottom: 90px; right: 20px; display: none; z-index: 4; font-size: 18px; padding: 14px 22px; }

  /* ---------- 共通UI ---------- */
  .overlay { position: fixed; inset: 0; display: none; z-index: 5; }
  .btn { border: none; color: #fff; cursor: pointer; font-weight: 900; font-family: inherit; border-radius: 14px; transition: transform .08s, box-shadow .08s; letter-spacing: 1px; }
  .btn:active { transform: translateY(4px); }
  .btn:disabled { opacity: .45; cursor: default; }
  .btn.yellow { background: #ffd23f; color: #3a2a00; box-shadow: 0 6px 0 #c79a00, 0 10px 18px rgba(0,0,0,.4); }
  .btn.yellow:active { box-shadow: 0 2px 0 #c79a00; }
  .btn.blue { background: #2f8cff; box-shadow: 0 6px 0 #1457b3, 0 10px 18px rgba(0,0,0,.4); }
  .btn.blue:active { box-shadow: 0 2px 0 #1457b3; }
  .btn.gray { background: #4b5568; box-shadow: 0 5px 0 #2b3342; }
  .btn.gray:active { box-shadow: 0 1px 0 #2b3342; }
  .btn.red { background: #ef4444; box-shadow: 0 6px 0 #a11d1d; }
  .btn.red:active { box-shadow: 0 2px 0 #a11d1d; }
  .bg { background: radial-gradient(circle at 50% 35%, #5b3cc4 0%, #2a1a6e 45%, #120a33 100%); overflow: hidden; }
  .bg::before { content: ""; position: absolute; inset: -50%; background: repeating-linear-gradient(60deg, rgba(255,255,255,.045) 0 40px, rgba(255,255,255,0) 40px 120px); animation: slide 14s linear infinite; }
  @keyframes slide { to { transform: translateX(160px); } }

  /* ---------- スタート画面 ---------- */
  #title { align-items: center; justify-content: center; flex-direction: column; text-align: center; }
  .logo { position: relative; font-size: clamp(34px, 7vw, 76px); font-weight: 900; font-style: italic; line-height: 1.05; -webkit-text-stroke: 3px #1b0f4d; paint-order: stroke fill; text-shadow: 0 6px 0 #1b0f4d, 0 12px 24px rgba(0,0,0,.5); background: linear-gradient(#fff6b0, #ffb703); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .logo small { display: block; font-size: .4em; -webkit-text-stroke: 2px #1b0f4d; letter-spacing: 4px; }
  .center { position: relative; display: flex; flex-direction: column; align-items: center; gap: 14px; width: min(92vw, 460px); margin-top: 26px; }
  .center .btn.big { width: 100%; font-size: 26px; padding: 20px 10px; }
  .field { width: 100%; font-size: 20px; font-weight: 800; padding: 13px 16px; border-radius: 12px; border: 3px solid #1b0f4d; background: #fff; color: #1b0f4d; text-align: center; outline: none; font-family: inherit; }
  .field::placeholder { color: #9a93bd; font-weight: 700; }
  .joinrow { display: flex; gap: 10px; width: 100%; }
  .joinrow .field { letter-spacing: 8px; font-size: 24px; }
  .joinrow .btn { font-size: 18px; padding: 0 22px; white-space: nowrap; }
  #err { min-height: 22px; color: #ff9aa2; font-weight: 800; }
  .skinrow { display: flex; gap: 8px; margin-top: 4px; justify-content: center; }
  .skinbtn { padding: 8px 14px; border-radius: 8px; border: 2px solid #fff; background: #374151; cursor: pointer; font-weight: bold; }
  .skinbtn.active { background: #ffd23f; color: #3a2a00; border-color: #ffd23f; }

  /* ---------- ロビー ---------- */
  #lobby { }
  #lobby .top-left { position: absolute; top: 16px; left: 16px; z-index: 2; }
  #codePill { position: absolute; top: 14px; right: 16px; z-index: 2; cursor: pointer; background: rgba(10,6,32,.75); border: 3px solid #ffd23f; border-radius: 16px; padding: 6px 18px 8px; text-align: center; box-shadow: 0 5px 0 #c79a00; }
  #codePill:active { transform: translateY(3px); box-shadow: 0 2px 0 #c79a00; }
  #codePill .lab { font-size: 11px; letter-spacing: 3px; color: #ffd23f; font-weight: 800; }
  #codePill .num { font-size: 32px; font-weight: 900; letter-spacing: 6px; font-style: italic; }
  .stage { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; pointer-events: none; }
  .spot { position: absolute; width: 520px; height: 520px; border-radius: 50%; background: radial-gradient(circle, rgba(255,255,255,.22), rgba(255,255,255,0) 65%); top: 50%; left: 50%; transform: translate(-50%, -58%); }
  .avatar { position: relative; width: 190px; height: 190px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 96px; background: radial-gradient(circle at 35% 30%, #7db6ff, #2f5fd0); border: 6px solid #fff; box-shadow: 0 14px 0 rgba(0,0,0,.35), 0 0 60px rgba(120,160,255,.6); animation: bob 2.2s ease-in-out infinite; }
  .avatar.oni { background: radial-gradient(circle at 35% 30%, #ff8d8d, #c21e1e); box-shadow: 0 14px 0 rgba(0,0,0,.35), 0 0 60px rgba(255,90,90,.6); }
  .avatar.auto { background: radial-gradient(circle at 35% 30%, #d9d9ff, #6b6bd6); }
  @keyframes bob { 50% { transform: translateY(-12px); } }
  .nameplate { margin-top: 30px; padding: 8px 28px; font-size: 24px; font-weight: 900; font-style: italic; background: #ffd23f; color: #3a2a00; border-radius: 8px; transform: skewX(-10deg); box-shadow: 0 5px 0 #c79a00; }
  .rolelabel { margin-top: 12px; font-weight: 800; letter-spacing: 3px; text-shadow: 0 2px 6px #000; }
  .roster { position: absolute; left: 16px; top: 76px; width: 230px; z-index: 2; display: flex; flex-direction: column; gap: 8px; max-height: 60vh; overflow: auto; }
  .card { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 9px 12px; border-radius: 10px; background: rgba(10,6,32,.7); border-left: 6px solid #64748b; font-weight: 800; }
  .card.runner { border-color: #2f8cff; } .card.oni { border-color: #ef4444; }
  .card.me { background: rgba(255,210,63,.22); }
  .badge { font-size: 12px; padding: 2px 9px; border-radius: 10px; background: #475569; white-space: nowrap; }
  .badge.runner { background: #2f8cff; } .badge.oni { background: #ef4444; }
  .bottom-left { position: absolute; left: 16px; bottom: 18px; z-index: 2; display: flex; gap: 10px; flex-wrap: wrap; }
  .bottom-left .btn { font-size: 16px; padding: 14px 18px; }
  .bottom-left .btn.active { background: #ffd23f; color: #3a2a00; box-shadow: 0 5px 0 #c79a00; }
  #start { position: absolute; right: 18px; bottom: 18px; z-index: 2; font-size: 32px; padding: 20px 46px; font-style: italic; }
  #lnote { position: absolute; bottom: 92px; right: 22px; z-index: 2; font-size: 13px; color: #d6d0ff; text-align: right; max-width: 320px; }

  /* ---------- コード拡大モーダル ---------- */
  #codeModal { background: rgba(8,4,28,.92); align-items: center; justify-content: center; flex-direction: column; cursor: pointer; z-index: 8; }
  #codeModal .lab { letter-spacing: 8px; color: #ffd23f; font-weight: 900; font-size: clamp(14px, 3vw, 28px); }
  #codeModal .big { font-size: clamp(60px, 22vw, 260px); font-weight: 900; font-style: italic; letter-spacing: .12em; line-height: 1.1; -webkit-text-stroke: 4px #1b0f4d; paint-order: stroke fill; background: linear-gradient(#fff6b0, #ffb703); -webkit-background-clip: text; background-clip: text; color: transparent; text-shadow: 0 8px 0 #1b0f4d; }
  #codeModal .sub { margin-top: 16px; color: #cfc9f5; }
  #codeModal .btn { margin-top: 20px; font-size: 20px; padding: 14px 34px; }

  /* ---------- 結果 ---------- */
  #result { background: rgba(0,0,0,.82); align-items: center; justify-content: center; flex-direction: column; text-align: center; }
  #result h1 { font-size: 64px; margin: 0 0 8px; font-style: italic; -webkit-text-stroke: 2px #000; }
  #result p { color: #ddd; margin: 6px 0; font-size: 18px; }
</style>
</head>
<body>
<canvas id="game"></canvas>
<canvas id="mini" width="160" height="160"></canvas>
<div id="hud"></div>
<div id="banner"></div>
<button class="btn red" id="placeBtn" style="font-size:22px;padding:16px 34px">📍 ここに消しゴムを設置 (SPACE)</button>
<button class="btn blue" id="itemBtn">⚡ アイテム使用 (Q)</button>
<div id="toast"></div>

<!-- スタート画面 -->
<div id="title" class="overlay bg" style="display:flex">
  <div class="logo" style="position:relative;text-align:center">消しゴム奪取<small>＆ エレベーター脱出</small></div>
  <div class="center">
    <input id="name" class="field" maxlength="12" placeholder="プレイヤー名">
    <div style="font-size:14px;font-weight:bold;color:#ffd23f">スキン選択</div>
    <div class="skinrow" id="skinSelect">
      <button class="skinbtn active" data-skin="default">👦 通常</button>
      <button class="skinbtn" data-skin="ninja">🥷 忍者</button>
      <button class="skinbtn" data-skin="robot">🤖 ロボット</button>
    </div>
    <button id="btnCreate" class="btn yellow big">ルームを作る</button>
    <button id="btnSolo" class="btn blue big">CPUと戦う</button>
    <div class="joinrow">
      <input id="code" class="field" inputmode="numeric" maxlength="5" placeholder="12345">
      <button id="btnJoin" class="btn gray">コードで参加</button>
    </div>
    <div id="err"></div>
  </div>
</div>

<!-- ロビー -->
<div id="lobby" class="overlay bg">
  <div class="top-left"><button id="leave" class="btn gray" style="font-size:16px;padding:10px 18px">◀ 退出</button></div>
  <div id="codePill"><div class="lab">ROOM CODE</div><div class="num" id="codeNum">-----</div></div>
  <div class="roster" id="roster"></div>
  <div class="stage">
    <div class="spot"></div>
    <div class="avatar" id="avatar">🏃</div>
    <div class="nameplate" id="myname">PLAYER</div>
    <div class="rolelabel" id="myrole"></div>
  </div>
  <div class="bottom-left">
    <button class="btn gray" data-role="runner">🏃 逃げ側</button>
    <button class="btn gray" data-role="oni">👹 鬼側</button>
    <button class="btn gray" data-role="auto">🎲 おまかせ</button>
  </div>
  <div id="lnote"></div>
  <button id="start" class="btn yellow">ゲーム開始 ▶</button>
</div>

<!-- ルームコード拡大 -->
<div id="codeModal" class="overlay">
  <div class="lab">ROOM CODE</div>
  <div class="big" id="codeBig">12345</div>
  <div class="sub">友達にこのコードを伝えてね（タップで閉じる）</div>
  <button class="btn yellow" id="copyBtn">コードをコピー</button>
</div>

<!-- 結果画面 -->
<div id="result" class="overlay">
  <h1 id="resTitle"></h1>
  <p id="resMsg"></p>
  <button class="btn yellow" id="toLobbyBtn" style="font-size:22px;padding:16px 36px;margin-top:20px">🏠 ロビーに戻る</button>
</div>

<script src="/socket.io/socket.io.js"></script>
<script>
const socket = io();
const $ = (id) => document.getElementById(id);
const cv = $('game'), ctx = cv.getContext('2d');
const mini = $('mini'), mctx = mini.getContext('2d');
const hud = $('hud');

let world = null, cfg = null, mazeCanvas = null, state = null, inGame = false;
let myRole = 'runner', myName = '', mySkin = 'default', lobbyData = null, TH = 0;
let views = {}, camV = null, meV = null, ended = false;
let prevOpen = false, lastSec = -1;

function resize() { cv.width = innerWidth; cv.height = innerHeight; }
addEventListener('resize', resize); resize();
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const show = (id, on) => { $(id).style.display = on ? 'flex' : 'none'; };

// ---------- スキン選択 ----------
let curSkin = 'default';
document.querySelectorAll('.skinbtn').forEach(b => {
  b.onclick = () => {
    document.querySelectorAll('.skinbtn').forEach(x => x.classList.remove('active'));
    b.classList.add('active');
    curSkin = b.dataset.skin;
    socket.emit('setSkin', curSkin);
  };
});

// ---------- サウンド ----------
let AC = null;
function beep(f, d, v, type) {
  if (!AC) return;
  const o = AC.createOscillator(), g = AC.createGain();
  o.type = type || 'square'; o.frequency.value = f; g.gain.value = v || 0.06;
  o.connect(g); g.connect(AC.destination); o.start();
  g.gain.exponentialRampToValueAtTime(0.0001, AC.currentTime + d); o.stop(AC.currentTime + d);
}
function initAudio() { if (!AC) { try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} } }

// ---------- スタート画面 ----------
try { $('name').value = localStorage.getItem('pname') || ''; } catch (e) {}
function nm() { const v = $('name').value.trim(); try { localStorage.setItem('pname', v); } catch (e) {} return v; }
$('btnCreate').onclick = () => { initAudio(); $('err').textContent = ''; socket.emit('create', { name: nm(), skin: curSkin }); };
$('btnSolo').onclick = () => { initAudio(); $('err').textContent = ''; socket.emit('solo', { name: nm(), skin: curSkin }); };
$('btnJoin').onclick = () => { initAudio(); $('err').textContent = ''; socket.emit('join', { name: nm(), code: $('code').value, skin: curSkin }); };
$('code').addEventListener('input', () => { $('code').value = $('code').value.replace(/\D/g, '').slice(0, 5); });
$('code').addEventListener('keydown', (e) => { if (e.key === 'Enter') $('btnJoin').click(); });
socket.on('errmsg', (m) => { $('err').textContent = m; });

// ---------- ロビー ----------
const roleLabel = { auto: 'おまかせ', runner: '逃げ側', oni: '鬼側' };
const roleEmoji = { auto: '🎲', runner: '🏃', oni: '👹' };
socket.on('lobby', (d) => {
  lobbyData = d;
  if (inGame && d.state === 'playing') return;
  if (d.state === 'lobby') { inGame = false; hideGameUI(); show('result', false); }
  if (!inGame) { show('title', false); show('lobby', true); renderLobby(); }
});
function renderLobby() {
  const d = lobbyData, me = d.players.find((p) => p.id === d.you) || { name: '', role: 'auto' };
  $('codeNum').textContent = d.code; $('codeBig').textContent = d.code;
  const ro = $('roster'); ro.innerHTML = '';
  for (const p of d.players) {
    const c = document.createElement('div'); c.className = 'card ' + p.role + (p.id === d.you ? ' me' : '');
    const s = document.createElement('span'); s.textContent = (p.id === d.host ? '👑 ' : '') + p.name;
    const b = document.createElement('span'); b.className = 'badge ' + p.role; b.textContent = roleLabel[p.role];
    c.append(s, b); ro.appendChild(c);
  }
  $('avatar').className = 'avatar ' + me.role; $('avatar').textContent = roleEmoji[me.role];
  $('myname').textContent = me.name; $('myrole').textContent = roleLabel[me.role];
  document.querySelectorAll('#lobby [data-role]').forEach((b) => b.classList.toggle('active', b.dataset.role === me.role));
  const host = d.host === d.you;
  $('start').style.display = host ? '' : 'none';
  $('start').disabled = d.state !== 'lobby';
  $('lnote').textContent = d.state === 'playing' ? '試合中です。終了までお待ちください。'
    : (host ? '鬼を選んだ人がいなければCPUの鬼が参加します。' : 'ホストの開始を待っています…');
}
document.querySelectorAll('#lobby [data-role]').forEach((b) => b.onclick = () => socket.emit('setRole', b.dataset.role));
$('start').onclick = () => { initAudio(); socket.emit('start'); };
$('leave').onclick = () => { socket.emit('leave'); lobbyData = null; show('lobby', false); show('title', true); };
$('toLobbyBtn').onclick = () => { socket.emit('leave'); show('result', false); show('lobby', true); };
$('codePill').onclick = () => show('codeModal', true);
$('codeModal').onclick = () => show('codeModal', false);
$('copyBtn').onclick = (e) => {
  e.stopPropagation();
  const t = lobbyData ? lobbyData.code : '';
  try { navigator.clipboard.writeText(t); $('copyBtn').textContent = 'コピーした！'; setTimeout(() => $('copyBtn').textContent = 'コードをコピー', 1500); } catch (er) {}
};
function hideGameUI() { mini.style.display = 'none'; hud.style.display = 'none'; $('banner').style.display = 'none'; $('placeBtn').style.display = 'none'; $('itemBtn').style.display = 'none'; }

// ---------- ゲーム開始 ----------
socket.on('init', (w) => {
  world = w; cfg = w.cfg; myRole = w.role; myName = w.name; TH = (2 - w.side) * Math.PI / 2;
  buildMaze(); state = null; views = {}; camV = null; meV = null; prevOpen = false; lastSec = -1; ended = false;
  for (const k in keys) keys[k] = 0;
  inGame = true;
  show('title', false); show('lobby', false); show('result', false); show('codeModal', false);
  mini.style.display = 'block'; hud.style.display = 'block';
  toast(myRole === 'runner' ? '逃げ側：消しゴムを探し、自分のエレベーターから脱出せよ！' : '鬼側：消しゴムを30秒以内に設置しよう！');
});
socket.on('ev', (m) => toast(m));
function toast(m) {
  const d = document.createElement('div'); d.textContent = m; $('toast').appendChild(d);
  setTimeout(() => d.remove(), 3600);
}
socket.on('state', (s) => {
  state = s;
  if (!inGame) return;
  TH = (2 - s.side) * Math.PI / 2;
  if (s.s === 'playing') ended = false;
  if (s.s !== 'playing' && !ended) {
    ended = true;
    const runnerWin = s.s === 'runwin', iWin = (myRole === 'runner') === runnerWin;
    $('resTitle').textContent = iWin ? '勝利！' : '敗北…';
    $('resTitle').style.color = iWin ? '#4ade80' : '#f87171';
    $('resMsg').textContent = s.s === 'runwin' ? (s.slide < 2 ? 'ギリギリで扉の隙間に滑り込んだ！（残り ' + s.slide.toFixed(1) + ' 秒）' : '消しゴムを持って脱出成功！')
      : s.s === 'oniwin' ? '逃げ側は全員捕まった。' : '時間切れ。逃げ切れなかった。';
    show('result', true);
  }
});
$('placeBtn').onclick = () => socket.emit('place');
$('itemBtn').onclick = () => socket.emit('useItem');

// ---------- 入力 ----------
const keys = { u: 0, d: 0, l: 0, r: 0 };
const kmap = { KeyW: 'u', ArrowUp: 'u', KeyS: 'd', ArrowDown: 'd', KeyA: 'l', ArrowLeft: 'l', KeyD: 'r', ArrowRight: 'r' };
function sendInput() {
  const sx = keys.r - keys.l, sy = keys.d - keys.u;
  const c = Math.round(Math.cos(TH)), s = Math.round(Math.sin(TH));
  const wx = sx * c + sy * s, wy = -sx * s + sy * c;
  socket.emit('input', { u: wy < 0, d: wy > 0, l: wx < 0, r: wx > 0 });
}
addEventListener('keydown', (e) => {
  if (!inGame) return;
  if (e.code === 'Space') { e.preventDefault(); socket.emit('place'); return; }
  if (e.code === 'KeyQ') { e.preventDefault(); socket.emit('useItem'); return; }
  const k = kmap[e.code]; if (!k) return;
  e.preventDefault();
  if (!keys[k]) { keys[k] = 1; sendInput(); }
});
addEventListener('keyup', (e) => {
  const k = kmap[e.code]; if (!k || !inGame) return;
  e.preventDefault();
  if (keys[k]) { keys[k] = 0; sendInput(); }
});
addEventListener('blur', () => { for (const k in keys) keys[k] = 0; if (inGame) sendInput(); });

// ---------- 迷路の事前描画 ----------
function buildMaze() {
  const { grid, T, N, map: M } = world;
  mazeCanvas = document.createElement('canvas'); mazeCanvas.width = M; mazeCanvas.height = M;
  const c = mazeCanvas.getContext('2d');
  c.fillStyle = '#20232c'; c.fillRect(0, 0, M, M);
  for (let y = 0; y < N; y++) for (let x = 0; x < N; x++) {
    if (grid[y][x] === '1') {
      c.fillStyle = '#6b7280'; c.fillRect(x * T, y * T, T, T);
      c.fillStyle = '#4b5563'; c.fillRect(x * T + 4, y * T + 4, T - 8, T - 8);
    } else {
      c.fillStyle = ((x + y) % 2) ? '#c9b99a' : '#bfae8e'; c.fillRect(x * T, y * T, T, T);
    }
  }
}

// ---------- 描画ヘルパ ----------
function smooth(cur, tgt, k) { cur.x += (tgt.x - cur.x) * k; cur.y += (tgt.y - cur.y) * k; }
let SX = 0, SY = 0;
function withWorld(fn) {
  ctx.save();
  ctx.translate(cv.width / 2 + SX, cv.height / 2 + SY);
  ctx.scale(cfg.zoom, cfg.zoom); ctx.rotate(TH); ctx.translate(-camV.x, -camV.y);
  fn(); ctx.restore();
}
function w2s(x, y) {
  const dx = x - camV.x, dy = y - camV.y, c = Math.cos(TH), s = Math.sin(TH);
  return { x: cv.width / 2 + SX + (dx * c - dy * s) * cfg.zoom, y: cv.height / 2 + SY + (dx * s + dy * c) * cfg.zoom };
}
function metalPanel(x, y, w, h) {
  const g = ctx.createLinearGradient(x, 0, x + w, 0);
  g.addColorStop(0, '#6b7280'); g.addColorStop(0.45, '#d1d5db'); g.addColorStop(0.55, '#9ca3af'); g.addColorStop(1, '#4b5563');
  ctx.fillStyle = g; ctx.fillRect(x, y, w, h);
  ctx.fillStyle = 'rgba(0,0,0,.25)';
  for (let i = 1; i < 4; i++) ctx.fillRect(x + (w * i) / 4 - 1, y + 4, 2, h - 8);
}

function drawElevator(i, el, now, owned, showOpen) {
  const E = world.elevs[i], T = world.T, cx = E.tx * T + T / 2, cy = E.ty * T + T / 2;
  const door = showOpen ? el.door : 0, open = showOpen && el.open;
  ctx.save(); ctx.translate(cx, cy); ctx.rotate((i - 2) * Math.PI / 2); ctx.translate(-T / 2, -T / 2);
  const ig = ctx.createLinearGradient(0, 0, 0, T);
  ig.addColorStop(0, '#fff7d6'); ig.addColorStop(1, '#b59a63');
  ctx.fillStyle = ig; ctx.fillRect(0, 0, T, T);
  ctx.fillStyle = 'rgba(0,0,0,.15)'; ctx.fillRect(0, 0, 6, T); ctx.fillRect(T - 6, 0, 6, T);
  ctx.fillStyle = '#7c6a43'; ctx.fillRect(10, T / 2, T - 20, 4);
  const half = T / 2, off = door * half;
  ctx.save(); ctx.beginPath(); ctx.rect(0, 0, T, T); ctx.clip();
  metalPanel(-off, 0, half, T); metalPanel(half + off, 0, half, T);
  if (open && el.left < 8 && door < 0.9) {
    ctx.fillStyle = Math.floor(now / 150) % 2 ? '#facc15' : '#111';
    ctx.fillRect(-off + half - 5, 0, 5, T); ctx.fillRect(half + off, 0, 5, T);
  }
  ctx.restore();
  ctx.strokeStyle = owned ? '#22d3ee' : '#111827'; ctx.lineWidth = owned ? 7 : 6; ctx.strokeRect(3, 3, T - 6, T - 6);
  const warn = open && el.left < 3, mid = open && el.left < 8, blink = Math.floor(now / (warn ? 90 : 220)) % 2;
  ctx.fillStyle = !showOpen ? '#4b5563' : !open ? '#7f1d1d' : warn ? (blink ? '#ef4444' : '#450a0a') : mid ? (blink ? '#f59e0b' : '#78350f') : '#22c55e';
  ctx.fillRect(T / 2 - 16, 8, 32, 8);
  ctx.restore();
  const lx = cx + E.dx * (T / 2 + 14), ly = cy + E.dy * (T / 2 + 14);
  ctx.save(); ctx.translate(lx, ly); ctx.rotate(-TH);
  ctx.font = 'bold 14px sans-serif'; ctx.textAlign = 'center';
  if (owned) { ctx.fillStyle = '#67e8f9'; ctx.fillText(open ? 'YOUR EXIT ' + Math.ceil(el.left) : 'YOUR EXIT', 0, 0); }
  else if (showOpen) { ctx.fillStyle = open ? (warn ? '#f87171' : '#fde68a') : '#9ca3af'; ctx.fillText(open ? 'EXIT ' + Math.ceil(el.left) : 'EXIT', 0, 0); }
  else { ctx.fillStyle = '#6b7280'; ctx.fillText('LOCK', 0, 0); }
  ctx.restore();
}

function bodyPath(isOni, r, skin) {
  ctx.beginPath();
  if (skin === 'robot') {
    ctx.rect(-r, -r, r * 2, r * 2);
  } else if (skin === 'ninja') {
    ctx.arc(0, 0, r, 0, Math.PI * 2);
  } else {
    ctx.arc(0, 0, r, 0, Math.PI * 2);
  }
  if (isOni) {
    ctx.moveTo(-13, -16); ctx.lineTo(-8, -32); ctx.lineTo(-3, -19); ctx.closePath();
    ctx.moveTo(13, -16); ctx.lineTo(8, -32); ctx.lineTo(3, -19); ctx.closePath();
  }
}
function drawActor(e, v, alpha, isMe, now) {
  const isOni = e.role === 'oni', r = isOni ? 22 : 18, skin = e.skin || 'default';
  ctx.save(); ctx.translate(v.x, v.y); ctx.rotate(-TH); ctx.globalAlpha = alpha;
  if (!e.al && !isOni) {
    ctx.strokeStyle = '#9ca3af'; ctx.lineWidth = 3; ctx.beginPath(); ctx.arc(0, 0, r, 0, 7); ctx.stroke(); ctx.restore(); return;
  }
  if (e.inv && Math.floor(now / 100) % 2) ctx.globalAlpha *= 0.35;
  if (isOni) {
    ctx.fillStyle = e.st ? '#9ca3af' : '#dc2626'; bodyPath(true, r, skin); ctx.fill();
    ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(-7, -4, 4.5, 0, 7); ctx.arc(7, -4, 4.5, 0, 7); ctx.fill();
    ctx.fillStyle = '#000'; ctx.beginPath(); ctx.arc(-7, -4, 2, 0, 7); ctx.arc(7, -4, 2, 0, 7); ctx.fill();
  } else {
    ctx.fillStyle = skin === 'ninja' ? '#111827' : skin === 'robot' ? '#93c5fd' : (isMe ? '#3b82f6' : '#22d3ee');
    bodyPath(false, r, skin); ctx.fill();
    ctx.strokeStyle = skin === 'ninja' ? '#f59e0b' : '#fff'; ctx.lineWidth = 3; ctx.stroke();
    if (e.e) { ctx.fillStyle = '#f9a8d4'; ctx.fillRect(-10, -34, 20, 12); ctx.fillStyle = '#3b82f6'; ctx.fillRect(-10, -34, 6, 12); }
  }
  ctx.globalAlpha = alpha * 0.9; ctx.fillStyle = '#fff'; ctx.font = '13px sans-serif'; ctx.textAlign = 'center';
  ctx.fillText(e.n || '', 0, r + 15);
  ctx.restore();
}

function drawSil(e, v, a, now) {
  const isOni = e.role === 'oni', r = isOni ? 22 : 18;
  ctx.save(); ctx.translate(v.x, v.y); ctx.rotate(-TH);
  ctx.globalAlpha = a * (0.8 + 0.2 * Math.sin(now / 130 + (v.x + v.y) * 0.05));
  ctx.fillStyle = '#050308'; bodyPath(isOni, r, 'default'); ctx.fill();
  ctx.strokeStyle = isOni ? 'rgba(255,70,70,0.75)' : 'rgba(130,225,255,0.65)'; ctx.lineWidth = 2; ctx.stroke();
  if (isOni && !e.st) {
    ctx.fillStyle = '#ff2a2a'; ctx.shadowColor = '#ff2a2a'; ctx.shadowBlur = 10;
    ctx.beginPath(); ctx.arc(-7, -4, 2.4, 0, 7); ctx.arc(7, -4, 2.4, 0, 7); ctx.fill();
  }
  ctx.restore();
}

// ---------- メインループ ----------
let lastT = performance.now();
function frame(now) {
  requestAnimationFrame(frame);
  const dt = Math.min((now - lastT) / 1000, 0.1); lastT = now;
  ctx.fillStyle = '#000'; ctx.fillRect(0, 0, cv.width, cv.height);
  if (!inGame || !world || !state) return;

  const k = 1 - Math.exp(-dt * 30);
  if (!camV) camV = { x: state.cam.x, y: state.cam.y };
  if (!meV) meV = { x: state.me.x, y: state.me.y };
  smooth(camV, state.cam, k); smooth(meV, state.me, k);
  const seen = {};
  for (const e of state.ents) { seen[e.id] = 1; if (!views[e.id]) views[e.id] = { x: e.x, y: e.y }; smooth(views[e.id], e, k); }
  for (const id in views) if (!seen[id]) delete views[id];

  const el = state.el, T = world.T, Z = cfg.zoom;
  const lightR = cfg.lightR[myRole], ghostR = cfg.ghostR[myRole];

  if (el.open && !prevOpen) beep(880, 0.25, 0.08, 'sine');
  if (!el.open && prevOpen) beep(80, 0.5, 0.2, 'sawtooth');
  prevOpen = el.open;
  if (el.open && el.left <= 8) { const sec = Math.ceil(el.left); if (sec !== lastSec) { lastSec = sec; beep(450 + (8 - sec) * 90, 0.12, 0.07); } } else lastSec = -1;

  const danger = el.open && el.left < 4 ? (4 - el.left) / 4 : 0;
  const sh = danger * (state.me.e ? 4 : 1.5);
  SX = sh ? (Math.random() - 0.5) * sh * 2 : 0; SY = sh ? (Math.random() - 0.5) * sh * 2 : 0;

  // ===== パス1：ワールド =====
  withWorld(() => {
    ctx.drawImage(mazeCanvas, 0, 0);
    for (let i = 0; i < 4; i++) {
      const owned = i === state.side;
      drawElevator(i, el, now, owned, myRole === 'oni' || owned);
    }
    // ワープ床
    if (state.warps) {
      for (const w of state.warps) {
        ctx.fillStyle = '#a855f7'; ctx.beginPath(); ctx.arc(w.x, w.y, 16, 0, Math.PI * 2); ctx.fill();
        ctx.strokeStyle = '#e879f9'; ctx.lineWidth = 3; ctx.stroke();
      }
    }
    // 宝箱
    if (state.chests) {
      for (const ch of state.chests) {
        ctx.fillStyle = '#fbbf24'; ctx.fillRect(ch.x - 12, ch.y - 10, 24, 20);
        ctx.strokeStyle = '#d97706'; ctx.lineWidth = 2; ctx.strokeRect(ch.x - 12, ch.y - 10, 24, 20);
      }
    }
    if (state.er && !state.er.c) {
      ctx.save(); ctx.translate(state.er.x, state.er.y); ctx.rotate(-TH);
      ctx.shadowColor = '#f9a8d4'; ctx.shadowBlur = 14;
      ctx.fillStyle = '#f9a8d4'; ctx.fillRect(-16, -10, 32, 20);
      ctx.fillStyle = '#3b82f6'; ctx.fillRect(-16, -10, 10, 20);
      ctx.restore();
    }
    for (const e of state.ents) {
      const v = views[e.id]; let a = 1;
      if (e.role !== myRole) { const d = Math.hypot(v.x - camV.x, v.y - camV.y); a = clamp((lightR * 0.8 - d) / (lightR * 0.35), 0, 1); if (a <= 0.02) continue; }
      drawActor(e, v, a, false, now);
    }
    if (state.me.al || myRole === 'oni') drawActor({ role: myRole, al: true, e: state.me.e, st: state.me.st, inv: state.me.inv, n: myName, skin: mySkin }, meV, state.me.invis ? 0.3 : 1, true, now);
  });

  // ===== 暗闇・靄 =====
  const cx = cv.width / 2 + SX, cy = cv.height / 2 + SY;
  const R = lightR * Z * (1 + Math.sin(now / 400) * 0.015);
  const grd = ctx.createRadialGradient(cx, cy, R * 0.3, cx, cy, R);
  grd.addColorStop(0, 'rgba(0,0,0,0)'); grd.addColorStop(0.6, 'rgba(0,0,0,0.3)'); grd.addColorStop(1, 'rgba(0,0,0,0.9)');
  ctx.fillStyle = grd; ctx.fillRect(0, 0, cv.width, cv.height);

  // ===== パス2：闇の中の影 =====
  withWorld(() => {
    for (const e of state.ents) {
      if (e.role === myRole) continue;
      const v = views[e.id], d = Math.hypot(v.x - camV.x, v.y - camV.y);
      const up = clamp((d - lightR * 0.5) / (lightR * 0.3), 0, 1), down = clamp((ghostR - d) / (ghostR - lightR * 0.9), 0, 1);
      const a = 0.62 * up * down;
      if (a > 0.02) drawSil(e, v, a, now);
    }
    if (state.er && !state.er.c) {
      const d = Math.hypot(state.er.x - camV.x, state.er.y - camV.y);
      if (d > lightR * 0.7) {
        ctx.save(); ctx.translate(state.er.x, state.er.y);
        ctx.globalAlpha = 0.35 + 0.25 * Math.sin(now / 200);
        ctx.fillStyle = '#f9a8d4'; ctx.shadowColor = '#f9a8d4'; ctx.shadowBlur = 16;
        ctx.beginPath(); ctx.arc(0, 0, 4, 0, 7); ctx.fill(); ctx.restore();
      }
    }
  });

  // ===== 消しゴムの方向を示す矢印 (画面端インジケーター) =====
  if (myRole === 'runner' && state.er && !state.er.c && state.er.x != null) {
    const p = w2s(state.er.x, state.er.y);
    if (p.x < 40 || p.x > cv.width - 40 || p.y < 40 || p.y > cv.height - 40) {
      const ang = Math.atan2(p.y - cy, p.x - cx);
      ctx.save(); ctx.translate(cx + Math.cos(ang) * 140, cy + Math.sin(ang) * 140); ctx.rotate(ang);
      ctx.fillStyle = '#facc15'; ctx.beginPath(); ctx.moveTo(16, 0); ctx.lineTo(-10, -11); ctx.lineTo(-10, 11); ctx.closePath(); ctx.fill();
      ctx.restore();
    }
  }

  // エレベーターの光
  if (el.open) {
    for (let i = 0; i < 4; i++) {
      if (myRole === 'runner' && i !== state.side) continue;
      const E = world.elevs[i], p = w2s(E.tx * T + T / 2, E.ty * T + T / 2);
      const warn = el.left < 3, mid = el.left < 8;
      const flick = warn ? (Math.floor(now / 90) % 2 ? 1 : 0.35) : mid ? (Math.floor(now / 220) % 2 ? 1 : 0.6) : 1;
      const col = warn ? '255,70,70' : mid ? '255,190,60' : '110,255,160';
      const gr = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, 200 * Z);
      gr.addColorStop(0, 'rgba(' + col + ',' + (0.55 * el.door * flick) + ')'); gr.addColorStop(1, 'rgba(' + col + ',0)');
      ctx.save(); ctx.globalCompositeOperation = 'lighter'; ctx.fillStyle = gr; ctx.fillRect(0, 0, cv.width, cv.height); ctx.restore();
    }
  }

  drawMini(now);
  updateHud();
}

function drawMini(now) {
  const S = mini.width, M = world.map, sc = S / M, T = world.T, el = state.el;
  mctx.clearRect(0, 0, S, S);
  mctx.save(); mctx.translate(S / 2, S / 2); mctx.rotate(TH); mctx.translate(-S / 2, -S / 2);
  mctx.globalAlpha = 0.85; mctx.drawImage(mazeCanvas, 0, 0, S, S); mctx.globalAlpha = 1;
  for (let i = 0; i < 4; i++) {
    const E = world.elevs[i], owned = i === state.side;
    if (myRole === 'runner' && !owned) mctx.fillStyle = '#374151';
    else mctx.fillStyle = el.open ? '#22c55e' : (owned ? '#22d3ee' : '#ef4444');
    mctx.fillRect(E.tx * T * sc, E.ty * T * sc, T * sc, T * sc);
    if (owned) { mctx.strokeStyle = '#fff'; mctx.lineWidth = 1.5; mctx.strokeRect(E.tx * T * sc, E.ty * T * sc, T * sc, T * sc); }
  }
  if (myRole === 'oni' && state.er && !state.er.c && state.er.x != null) {
    mctx.fillStyle = '#facc15'; mctx.beginPath(); mctx.arc(state.er.x * sc, state.er.y * sc, 4, 0, 7); mctx.fill();
  }
  for (const e of state.ents) {
    if (e.role !== myRole || e.al === false) continue;
    mctx.fillStyle = myRole === 'oni' ? '#f87171' : '#22d3ee';
    mctx.beginPath(); mctx.arc(e.x * sc, e.y * sc, 3, 0, 7); mctx.fill();
  }
  if (state.me.al || myRole === 'oni') {
    mctx.fillStyle = myRole === 'oni' ? '#ef4444' : '#3b82f6';
    mctx.beginPath(); mctx.arc(meV.x * sc, meV.y * sc, 4, 0, 7); mctx.fill();
    mctx.strokeStyle = '#fff'; mctx.lineWidth = 1; mctx.stroke();
  }
  mctx.restore();
}

function updateHud() {
  const s = state, el = s.el;
  const b = $('banner'), pb = $('placeBtn'), ib = $('itemBtn');
  pb.style.display = 'none'; ib.style.display = 'none';

  if (s.ph === 'place' && s.s === 'playing') {
    const sec = Math.ceil(s.pl);
    b.style.display = 'block'; b.style.color = '#fde68a';
    if (myRole === 'oni') {
      if (!s.placed) { b.innerHTML = '消しゴムを置く場所を選べ！（残り ' + sec + '秒）<br><span style="font-size:15px;color:#fff">好きな場所まで歩いて SPACE またはボタンで設置</span>'; pb.style.display = 'block'; }
      else b.textContent = '設置完了…スタートまで ' + sec;
    } else b.innerHTML = '鬼が消しゴムを隠しています（残り ' + sec + '秒）<br><span style="font-size:15px;color:#fff">スタートまで待機中…</span>';
  } else if (myRole === 'runner' && !s.me.al && s.s === 'playing') { b.style.display = 'block'; b.style.color = '#fca5a5'; b.textContent = '捕まった…仲間を観戦中'; }
  else if (myRole === 'oni' && s.me.st && s.s === 'playing') { b.style.display = 'block'; b.style.color = '#d1d5db'; b.textContent = '硬直中…'; }
  else b.style.display = 'none';

  if (s.me.item && s.s === 'playing') {
    ib.style.display = 'block';
    const names = { stun: 'スタングレネード', speed: 'スピードブーツ', invis: '透明化スーツ' };
    ib.textContent = '⚡ アイテム: ' + names[s.me.item] + ' (Q)';
  }

  const t = Math.max(0, Math.ceil(s.t)), mm = Math.floor(t / 60), ss = String(t % 60).padStart(2, '0');
  let h = '<b style="color:' + (myRole === 'oni' ? '#f87171' : '#60a5fa') + '">' + (myRole === 'oni' ? '👹 鬼側' : '🏃 逃げ側') + '</b> 残り ' + mm + ':' + ss;
  h += '<br>生存している逃げ側：' + s.n;
  if (myRole === 'runner') h += '<br>消しゴム：' + (s.me.e ? '<b style="color:#f9a8d4">所持中！自分のエレベーターへ</b>' : s.er && s.er.c ? '誰かが所持' : '矢印の方向へ探索せよ');
  else h += '<br>消しゴム：' + (!s.placed ? '未設置' : s.er && s.er.c ? '奪われた！' : '設置完了');
  h += '<br>エレベーター：' + (el.open ? '<b style="color:' + (el.left < 3 ? '#f87171' : el.left < 8 ? '#fbbf24' : '#4ade80') + '">OPEN 残り ' + el.left.toFixed(1) + '秒</b>' : '<span style="color:#f87171">CLOSED</span>');
  hud.innerHTML = h;
}
requestAnimationFrame(frame);
</script>
</body>
</html>
