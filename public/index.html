<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>消しゴム奪取＆エレベーター脱出 - ミニマップ搭載編</title>
    <style>
        body {
            margin: 0;
            background: #111;
            color: #fff;
            font-family: sans-serif;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        #screen {
            position: relative;
            width: 800px;
            height: 600px;
            background: #222;
            box-shadow: 0 0 20px rgba(0,0,0,0.8);
            border-radius: 8px;
            overflow: hidden;
        }
        .panel {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: rgba(20,20,20,0.95);
            z-index: 10;
        }
        h1 { color: #ff4757; font-size: 30px; margin-bottom: 10px; text-shadow: 0 0 10px rgba(255,71,87,0.5); }
        p { color: #aaa; margin-bottom: 20px; text-align: center; max-width: 500px; }
        input, button {
            padding: 12px 24px;
            font-size: 16px;
            margin: 8px;
            border-radius: 6px;
            border: none;
            outline: none;
            cursor: pointer;
        }
        input { background: #333; color: white; border: 1px solid #555; width: 250px; text-align: center; }
        .btn-primary { background: #2ed573; color: white; font-weight: bold; }
        .btn-primary:hover { background: #26af5f; }
        canvas { display: block; }
        #hud {
            position: absolute;
            top: 10px; left: 10px;
            background: rgba(0,0,0,0.7);
            padding: 10px 15px;
            border-radius: 6px;
            font-size: 14px;
            pointer-events: none;
            z-index: 5;
            border: 1px solid #444;
        }
        #minimapCanvas {
            position: absolute;
            top: 10px; right: 10px;
            width: 160px; height: 160px;
            background: rgba(0, 0, 0, 0.8);
            border: 2px solid #555;
            border-radius: 6px;
            z-index: 5;
            pointer-events: none;
        }
    </style>
</head>
<body>

<div id="screen">
    <div id="lobby" class="panel">
        <h1>消しゴム奪取：完全版迷路</h1>
        <p>右上の全体マップで構造を確認しつつ、鬼に見つからないよう気を付けて消しゴムを奪い脱出しろ！</p>
        <input type="text" id="playerName" placeholder="プレイヤー名を入力" value="プレイヤー1">
        <div>
            <button class="btn-primary" onclick="startGame()">ゲームスタート</button>
        </div>
    </div>

    <div id="hud" style="display:none;">
        <div id="hud-text">ステータス</div>
    </div>

    <canvas id="minimapCanvas" width="160" height="160" style="display:none;"></canvas>
    <canvas id="gameCanvas" width="800" height="600"></canvas>
</div>

<script src="/socket.io/socket.io.js"></script>
<script>
    const socket = io();
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const minimapCanvas = document.getElementById('minimapCanvas');
    const minimapCtx = minimapCanvas.getContext('2d');
    const lobby = document.getElementById('lobby');
    const hud = document.getElementById('hud');
    const hudText = document.getElementById('hud-text');

    const MAP_WIDTH = 2000;
    const MAP_HEIGHT = 2000;
    const CAMERA_ZOOM = 1.35;

    const walls = [
        { x: 0, y: 0, w: MAP_WIDTH, h: 50 },
        { x: 0, y: MAP_HEIGHT - 50, w: MAP_WIDTH, h: 50 },
        { x: 0, y: 0, w: 50, h: MAP_HEIGHT },
        { x: MAP_WIDTH - 50, y: 0, w: 50, h: MAP_HEIGHT },
        { x: 250, y: 250, w: 1500, h: 50 },
        { x: 250, y: 300, w: 50, h: 450 },
        { x: 650, y: 450, w: 50, h: 850 },
        { x: 1050, y: 300, w: 50, h: 550 },
        { x: 450, y: 950, w: 1100, h: 50 },
        { x: 250, y: 1250, w: 950, h: 50 },
        { x: 1500, y: 550, w: 50, h: 1000 },
        { x: 850, y: 1550, w: 850, h: 50 },
        { x: 450, y: 1550, w: 50, h: 350 }
    ];

    let player = null;
    let cpu = null;
    let gameData = null;
    let inputKeys = { up: false, down: false, left: false, right: false };

    function startGame() {
        const name = document.getElementById('playerName').value || 'プレイヤー';
        lobby.style.display = 'none';
        hud.style.display = 'block';
        minimapCanvas.style.display = 'block';
        socket.emit('join_game', { name, mode: 'cpu' });
    }

    window.addEventListener('keydown', (e) => {
        if (e.key === 'w' || e.key === 'ArrowUp') inputKeys.up = true;
        if (e.key === 's' || e.key === 'ArrowDown') inputKeys.down = true;
        if (e.key === 'a' || e.key === 'ArrowLeft') inputKeys.left = true;
        if (e.key === 'd' || e.key === 'ArrowRight') inputKeys.right = true;
    });

    window.addEventListener('keyup', (e) => {
        if (e.key === 'w' || e.key === 'ArrowUp') inputKeys.up = false;
        if (e.key === 's' || e.key === 'ArrowDown') inputKeys.down = false;
        if (e.key === 'a' || e.key === 'ArrowLeft') inputKeys.left = false;
        if (e.key === 'd' || e.key === 'ArrowRight') inputKeys.right = false;
    });

    socket.on('init', (data) => {
        player = data.player;
        cpu = data.cpu;
        gameData = data.gameData;
    });

    socket.on('update', (data) => {
        player = data.player;
        cpu = data.cpu;
        gameData = data.gameData;
    });

    function update() {
        if (!player || gameData.gameOver || player.escaped) return;
        socket.emit('move', inputKeys);
    }

    function draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        if (!player || !gameData) return;

        // メイン画面（プレイヤー視点ズーム）
        ctx.save();
        ctx.translate(canvas.width / 2, canvas.height / 2);
        ctx.scale(CAMERA_ZOOM, CAMERA_ZOOM);
        ctx.translate(-player.x, -player.y);

        ctx.fillStyle = '#1e1e1e';
        ctx.fillRect(0, 0, MAP_WIDTH, MAP_HEIGHT);

        for (let w of walls) {
            ctx.fillStyle = '#3d3d3d';
            ctx.fillRect(w.x, w.y, w.w, w.h);
            ctx.strokeStyle = '#555';
            ctx.lineWidth = 2;
            ctx.strokeRect(w.x, w.y, w.w, w.h);
        }

        let el = gameData.elevator;
        ctx.fillStyle = el.isOpen ? '#2ed573' : '#ff4757';
        ctx.fillRect(el.x - 40, el.y - 25, 80, 50);
        ctx.fillStyle = '#fff';
        ctx.font = 'bold 12px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText(el.isOpen ? `脱出口 (${Math.ceil(el.timer/60)}s)` : 'エレベーター閉', el.x, el.y - 35);

        let e = gameData.eraser;
        if (!e.isTaken) {
            ctx.fillStyle = '#ffa502';
            ctx.fillRect(e.x - 16, e.y - 12, 32, 24);
            ctx.strokeStyle = '#fff';
            ctx.strokeRect(e.x - 16, e.y - 12, 32, 24);
            ctx.fillStyle = '#fff';
            ctx.fillText('消しゴム', e.x, e.y - 20);
        }

        // プレイヤー
        ctx.beginPath();
        ctx.arc(player.x, player.y, player.radius, 0, Math.PI * 2);
        ctx.fillStyle = player.color;
        ctx.fill();
        ctx.lineWidth = 3;
        ctx.strokeStyle = '#fff';
        ctx.stroke();
        ctx.closePath();

        ctx.fillStyle = '#fff';
        ctx.fillText(player.name, player.x, player.y - 24);
        if (player.hasEraser) {
            ctx.fillText('📦 消しゴム所持!', player.x, player.y + 28);
        }

        // 鬼（メイン画面では見える）
        if (cpu) {
            ctx.beginPath();
            ctx.arc(cpu.x, cpu.y, cpu.radius, 0, Math.PI * 2);
            ctx.fillStyle = cpu.color;
            ctx.fill();
            ctx.lineWidth = 3;
            ctx.strokeStyle = '#fff';
            ctx.stroke();
            ctx.closePath();

            ctx.fillStyle = '#ff4757';
            ctx.fillText('👹 ' + cpu.name, cpu.x, cpu.y - 24);
        }

        ctx.restore();

        // ミニマップの描画（※鬼の位置は非表示！プレイヤー、消しゴム、エレベーターのみ表示）
        minimapCtx.clearRect(0, 0, minimapCanvas.width, minimapCanvas.height);
        let scaleX = minimapCanvas.width / MAP_WIDTH;
        let scaleY = minimapCanvas.height / MAP_HEIGHT;

        // 壁
        minimapCtx.fillStyle = '#555';
        for (let w of walls) {
            minimapCtx.fillRect(w.x * scaleX, w.y * scaleY, w.w * scaleX, w.h * scaleY);
        }

        // エレベーター
        minimapCtx.fillStyle = el.isOpen ? '#2ed573' : '#ff4757';
        minimapCtx.fillRect((el.x - 40) * scaleX, (el.y - 25) * scaleY, 80 * scaleX, 50 * scaleY);

        // 消しゴム
        if (!e.isTaken) {
            minimapCtx.fillStyle = '#ffa502';
            minimapCtx.fillRect((e.x - 16) * scaleX, (e.y - 12) * scaleY, 32 * scaleX, 24 * scaleY);
        }

        // プレイヤーの位置のみ表示（鬼の位置は隠されています）
        minimapCtx.fillStyle = '#2ed573';
        minimapCtx.beginPath();
        minimapCtx.arc(player.x * scaleX, player.y * scaleY, 4, 0, Math.PI * 2);
        minimapCtx.fill();

        // ステータス
        if (player.escaped) {
            hudText.innerHTML = '<span style="color:#2ed573; font-size:18px;">🎉 脱出成功！おめでとう！</span>';
        } else if (gameData.gameOver) {
            hudText.innerHTML = '<span style="color:#ff4757; font-size:18px;">💥 捕まってしまった…ゲームオーバー</span>';
        } else if (player.hasEraser) {
            hudText.innerHTML = '📦 消しゴムをゲット！最下部中央のエレベーターへ急げ！！';
        } else {
            hudText.innerHTML = '🏃 迷路の通路を抜けて最奥にある消しゴムを奪え！';
        }
    }

    function loop() {
        update();
        draw();
        requestAnimationFrame(loop);
    }

    loop();
</script>
</body>
</html>
