<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>消しゴム奪取＆エレベーター脱出</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; font-family: sans-serif; color: #fff; }
  canvas#game { display: block; width: 100vw; height: 100vh; }
  #mini { position: fixed; top: 12px; right: 12px; width: 180px; height: 180px; border: 2px solid #888; background: #111; display: none; }
  #hud { position: fixed; top: 12px; left: 12px; font-size: 16px; text-shadow: 0 0 4px #000; display: none; line-height: 1.6; }
  .overlay { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; background: rgba(0,0,0,.85); text-align: center; }
  .overlay h1 { margin: 0 0 8px; font-size: 32px; }
  .overlay p { margin: 6px 0; color: #ccc; }
  input, button { font-size: 18px; padding: 10px 16px; margin-top: 14px; border-radius: 8px; border: none; }
  button { background: #e8453c; color: #fff; cursor: pointer; }
  #result { display: none; }
</style>
</head>
<body>
<canvas id="game"></canvas>
<canvas id="mini" width="180" height="180"></canvas>
<div id="hud"></div>

<div id="title" class="overlay">
  <h1>消しゴム奪取＆エレベーター脱出</h1>
  <p>最奥の消しゴムを奪い、エレベーターへ戻れ。鬼はミニマップに映らない。</p>
  <p>操作：WASD / 矢印キー</p>
  <input id="name" maxlength="12" placeholder="プレイヤー名" />
  <button id="start">CPU対戦スタート</button>
</div>
<div id="result" class="overlay">
  <h1 id="resTitle"></h1>
  <p id="resMsg"></p>
  <button id="retry">もう一度</button>
</div>

<script src="/socket.io/socket.io.js"></script>
<script>
const CAMERA_ZOOM = 1.35;
const socket = io();
const cv = document.getElementById('game'), ctx = cv.getContext('2d');
const mini = document.getElementById('mini'), mctx = mini.getContext('2d');
const hud = document.getElementById('hud');

let world = null, mazeCanvas = null, state = null, playing = false;
const view = { p: null, o: null };   // 描画用（補間）位置
let myName = 'プレイヤー';

function resize() { cv.width = innerWidth; cv.height = innerHeight; }
addEventListener('resize', resize); resize();

// ---- UI ----
function startGame() {
  myName = document.getElementById('name').value.trim() || 'プレイヤー';
  socket.emit('join', { name: myName });
}
document.getElementById('start').onclick = startGame;
document.getElementById('retry').onclick = startGame;
document.getElementById('name').addEventListener('keydown', (e) => { if (e.key === 'Enter') startGame(); });

socket.on('init', (w) => {
  world = w;
  buildMaze();
  state = null; view.p = null; view.o = null;
  playing = true;
  document.getElementById('title').style.display = 'none';
  document.getElementById('result').style.display = 'none';
  mini.style.display = 'block'; hud.style.display = 'block';
});

socket.on('state', (s) => {
  state = s;
  if (!view.p) view.p = { x: s.p.x, y: s.p.y };
  if (s.o && !view.o) view.o = { x: s.o.x, y: s.o.y };
  if (!s.o) view.o = null;
  if (s.s !== 'playing' && playing) {
    playing = false;
    const res = document.getElementById('result');
    document.getElementById('resTitle').textContent = s.s === 'won' ? '脱出成功！' : 'ゲームオーバー';
    document.getElementById('resMsg').textContent = s.s === 'won' ? '消しゴムを持ってエレベーターに乗り込んだ！' : '消しゴムを持たずに鬼に捕まった…';
    res.style.display = 'flex';
  }
});

// ---- 入力 ----
const keys = { u: 0, d: 0, l: 0, r: 0 };
const map = { KeyW: 'u', ArrowUp: 'u', KeyS: 'd', ArrowDown: 'd', KeyA: 'l', ArrowLeft: 'l', KeyD: 'r', ArrowRight: 'r' };
function setKey(e, v) {
  const k = map[e.code];
  if (!k) return;
  if (document.activeElement && document.activeElement.tagName === 'INPUT') return;
  e.preventDefault();
  if (keys[k] !== v) { keys[k] = v; socket.emit('input', keys); }
}
addEventListener('keydown', (e) => setKey(e, 1));
addEventListener('keyup', (e) => setKey(e, 0));
addEventListener('blur', () => { for (const k in keys) keys[k] = 0; socket.emit('input', keys); });

// ---- 迷路の事前描画 ----
function buildMaze() {
  const { grid, T, N, map: M } = world;
  mazeCanvas = document.createElement('canvas');
  mazeCanvas.width = M; mazeCanvas.height = M;
  const c = mazeCanvas.getContext('2d');
  c.fillStyle = '#2b2f3a'; c.fillRect(0, 0, M, M);
  for (let y = 0; y < N; y++) for (let x = 0; x < N; x++) {
    if (grid[y][x] === '1') {
      c.fillStyle = '#6b7280'; c.fillRect(x * T, y * T, T, T);
      c.fillStyle = '#4b5563'; c.fillRect(x * T + 4, y * T + 4, T - 8, T - 8);
    } else {
      c.fillStyle = ((x + y) % 2) ? '#c9b99a' : '#bfae8e';
      c.fillRect(x * T, y * T, T, T);
    }
  }
}

// ---- 描画 ----
let lastT = performance.now();
function lerpTo(cur, tgt, k) { cur.x += (tgt.x - cur.x) * k; cur.y += (tgt.y - cur.y) * k; }

function frame(now) {
  requestAnimationFrame(frame);
  const dt = Math.min((now - lastT) / 1000, 0.1); lastT = now;
  ctx.fillStyle = '#000'; ctx.fillRect(0, 0, cv.width, cv.height);
  if (!world || !state) return;

  const k = 1 - Math.exp(-dt * 30);
  lerpTo(view.p, state.p, k);
  if (state.o) { if (!view.o) view.o = { x: state.o.x, y: state.o.y }; lerpTo(view.o, state.o, k); }

  const { T, elev, map: M } = world;
  ctx.save();
  ctx.translate(cv.width / 2, cv.height / 2);
  ctx.scale(CAMERA_ZOOM, CAMERA_ZOOM);
  ctx.translate(-view.p.x, -view.p.y);

  ctx.drawImage(mazeCanvas, 0, 0);

  // エレベーター
  const ex = elev.tx * T, ey = elev.ty * T;
  ctx.fillStyle = state.el.open ? '#22c55e' : '#7f1d1d';
  ctx.fillRect(ex, ey, T, T);
  ctx.fillStyle = '#fff'; ctx.font = 'bold 18px sans-serif'; ctx.textAlign = 'center';
  ctx.fillText(state.el.open ? 'OPEN' : 'CLOSED', ex + T / 2, ey + T / 2 + 6);

  // 消しゴム（未所持時）
  if (!state.er.c) {
    ctx.save(); ctx.translate(state.er.x, state.er.y);
    ctx.fillStyle = '#f9a8d4'; ctx.fillRect(-16, -10, 32, 20);
    ctx.fillStyle = '#3b82f6'; ctx.fillRect(-16, -10, 10, 20);
    ctx.restore();
  }

  // 鬼
  if (state.o && view.o) {
    ctx.fillStyle = state.o.st ? '#9ca3af' : '#dc2626';
    ctx.beginPath(); ctx.arc(view.o.x, view.o.y, 24, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#fff';
    ctx.beginPath(); ctx.arc(view.o.x - 8, view.o.y - 5, 5, 0, 7); ctx.arc(view.o.x + 8, view.o.y - 5, 5, 0, 7); ctx.fill();
    ctx.fillStyle = '#000';
    ctx.beginPath(); ctx.arc(view.o.x - 8, view.o.y - 5, 2, 0, 7); ctx.arc(view.o.x + 8, view.o.y - 5, 2, 0, 7); ctx.fill();
    ctx.fillStyle = '#fff'; // 角
    ctx.beginPath(); ctx.moveTo(view.o.x - 14, view.o.y - 18); ctx.lineTo(view.o.x - 8, view.o.y - 34); ctx.lineTo(view.o.x - 3, view.o.y - 21); ctx.fill();
    ctx.beginPath(); ctx.moveTo(view.o.x + 14, view.o.y - 18); ctx.lineTo(view.o.x + 8, view.o.y - 34); ctx.lineTo(view.o.x + 3, view.o.y - 21); ctx.fill();
  }

  // プレイヤー
  if (!state.p.inv || Math.floor(now / 100) % 2 === 0) {
    ctx.fillStyle = '#3b82f6';
    ctx.beginPath(); ctx.arc(view.p.x, view.p.y, 20, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = '#fff'; ctx.lineWidth = 3; ctx.stroke();
    if (state.p.e) {
      ctx.fillStyle = '#f9a8d4'; ctx.fillRect(view.p.x - 10, view.p.y - 36, 20, 12);
    }
  }
  ctx.fillStyle = '#fff'; ctx.font = '14px sans-serif'; ctx.textAlign = 'center';
  ctx.fillText(myName, view.p.x, view.p.y + 38);
  ctx.restore();

  // 暗闇（視界の恐怖感）
  const r = Math.max(cv.width, cv.height) * 0.55;
  const grd = ctx.createRadialGradient(cv.width / 2, cv.height / 2, r * 0.25, cv.width / 2, cv.height / 2, r);
  grd.addColorStop(0, 'rgba(0,0,0,0)'); grd.addColorStop(1, 'rgba(0,0,0,0.88)');
  ctx.fillStyle = grd; ctx.fillRect(0, 0, cv.width, cv.height);

  drawMini(M);

  // HUD
  const el = state.el;
  hud.innerHTML = '消しゴム：' + (state.p.e ? '<b style="color:#f9a8d4">所持中！</b>' : (state.er.c ? '' : '未取得')) +
    '<br>エレベーター：' + (el.open ? '<b style="color:#4ade80">OPEN 残り ' + el.left.toFixed(1) + '秒</b>' : '<span style="color:#f87171">CLOSED</span>');
}

function drawMini(M) {
  const S = mini.width, sc = S / M;
  mctx.clearRect(0, 0, S, S);
  mctx.drawImage(mazeCanvas, 0, 0, S, S);
  const { T, elev } = world;
  mctx.fillStyle = state.el.open ? '#22c55e' : '#ef4444';
  mctx.fillRect(elev.tx * T * sc, elev.ty * T * sc, T * sc, T * sc);
  if (!state.er.c) { mctx.fillStyle = '#facc15'; mctx.beginPath(); mctx.arc(state.er.x * sc, state.er.y * sc, 5, 0, 7); mctx.fill(); }
  mctx.fillStyle = '#3b82f6'; mctx.beginPath(); mctx.arc(view.p.x * sc, view.p.y * sc, 4, 0, 7); mctx.fill();
  // ※鬼はミニマップに描画しない仕様
}
requestAnimationFrame(frame);
</script>
</body>
</html>
