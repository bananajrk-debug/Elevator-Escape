<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>消しゴム奪取＆エレベーター脱出</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#12132a;color:#fff;font-family:"Hiragino Sans","Yu Gothic",system-ui,sans-serif;user-select:none}
button,input,select{font:inherit}
.btn{background:linear-gradient(#ffd54a,#ff9f1c);color:#3a2300;border:0;border-bottom:4px solid #b36b00;border-radius:14px;padding:12px 18px;font-weight:800;cursor:pointer;font-size:16px}
.btn:active{transform:translateY(2px);border-bottom-width:2px}
.btn.b{background:linear-gradient(#6ec1ff,#2f7cf6);color:#fff;border-bottom-color:#1b4aa8}
.btn.g{background:linear-gradient(#7be08b,#2fb14a);color:#fff;border-bottom-color:#1c7330}
.btn.r{background:linear-gradient(#ff8a8a,#e03a3a);color:#fff;border-bottom-color:#8f1d1d}
.btn.s{padding:7px 12px;font-size:13px}
input,select{background:#1f2147;color:#fff;border:2px solid #4a4f96;border-radius:10px;padding:9px 12px;font-size:15px;min-width:0}
.scr{position:fixed;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:64px 16px 16px;overflow:auto;text-align:center}
.scr.on{display:flex}
#title{z-index:5;background:radial-gradient(circle at 50% 30%,#3a3f9e,#12132a 70%)}
#lobby{z-index:40;background:radial-gradient(circle at 50% 20%,#2c3a86,#12132a 75%)}
h1{margin:0;font-size:clamp(26px,6vw,46px);text-shadow:0 4px 0 #b36b00,0 0 24px #ffd54a;color:#ffe27a;line-height:1.15}
.row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;align-items:center}
.card{background:#1b1d40cc;border:2px solid #4a4f96;border-radius:16px;padding:14px;max-width:560px;width:100%}
#nav{position:fixed;top:0;left:0;right:0;height:52px;z-index:130;display:flex;gap:8px;align-items:center;padding:6px 10px;background:linear-gradient(#0b0c1f,#0b0c1fcc)}
#nav .tab{background:#2a2d6b;color:#fff;border:2px solid #4a4f96;border-radius:12px;padding:7px 12px;font-weight:700;cursor:pointer}
#nav .tab.on{background:#ffb703;color:#3a2300}
#shards{margin-left:auto;font-weight:800;color:#ffe27a}
#burger{font-size:22px;padding:4px 12px}
#panel{position:fixed;inset:52px 0 0 0;z-index:120;background:#12132af2;display:none;overflow:auto;padding:16px}
#panel.on{display:block}
.item{display:flex;align-items:center;gap:10px;background:#23265a;border-radius:12px;padding:10px;margin:8px auto;max-width:560px;text-align:left}
.bar{height:10px;background:#0006;border-radius:6px;overflow:hidden;flex:1}.bar i{display:block;height:100%;background:#7be08b;width:0}
.skins{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:10px;max-width:640px;margin:auto}
.skc{background:#23265a;border-radius:12px;padding:8px;text-align:center;border:3px solid transparent}.skc.sel{border-color:#ffd54a}
#drawer{position:fixed;top:52px;left:0;bottom:0;width:min(340px,86vw);z-index:125;background:#161838f5;border-right:3px solid #4a4f96;padding:14px;overflow:auto;transform:translateX(-105%);transition:transform .25s;text-align:left}
#drawer.on{transform:none}
#drawer h3{margin:12px 0 6px;color:#ffe27a}
#drawer input{width:100%;margin:3px 0}
#prev{position:fixed;right:14px;top:50%;transform:translateY(-50%);z-index:124;display:none;flex-direction:column;align-items:center;gap:6px;pointer-events:none}
#prev.on{display:flex}#prev canvas{background:#ffffff14;border-radius:20px;border:3px solid #ffd54a}
#cv{position:fixed;inset:0;z-index:10;display:none;background:#000}#cv.on{display:block}
#hud{position:fixed;inset:0;z-index:20;display:none;pointer-events:none}#hud.on{display:block}
#hud>*{position:absolute}
#top{top:58px;left:50%;transform:translateX(-50%);text-align:center;font-weight:800;text-shadow:0 2px 4px #000;font-size:15px}
#hp{top:58px;left:60px;width:140px;height:14px;background:#0008;border-radius:7px;overflow:hidden;border:2px solid #fff}#hp i{display:block;height:100%;background:#ff5d6c}
#log{left:10px;bottom:150px;font-size:13px;text-shadow:0 2px 3px #000;max-width:60vw}
#log div{background:#0009;border-radius:8px;padding:3px 8px;margin-top:3px}
#tc{bottom:12px;left:12px;right:12px;display:flex;justify-content:space-between;align-items:flex-end;pointer-events:none}
#tc button{pointer-events:auto;width:58px;height:58px;border-radius:50%;border:3px solid #fff8;background:#ffffff33;color:#fff;font-size:22px;touch-action:none}
.dp{display:grid;grid-template-columns:repeat(3,58px);gap:4px}.dp .z{visibility:hidden}
#ld{position:fixed;inset:0;z-index:200;background:linear-gradient(#5ec8ff,#c8f1ff 60%,#ffe8a8);display:none}#ld.on{display:block}
#ld canvas{position:absolute;inset:0;width:100%;height:100%}
#ldt{position:absolute;top:16%;left:0;right:0;text-align:center;font-size:clamp(30px,8vw,64px);font-weight:900;color:#fff;-webkit-text-stroke:3px #2f7cf6;text-shadow:0 6px 0 #1b4aa8;letter-spacing:4px}
#ldb{position:absolute;top:34%;left:50%;width:min(420px,70vw);height:22px;transform:translateX(-50%);background:#0004;border:3px solid #fff;border-radius:14px;overflow:hidden}#ldb i{display:block;height:100%;width:0;background:repeating-linear-gradient(45deg,#ffd54a 0 12px,#ff9f1c 12px 24px)}
#fl{position:fixed;inset:0;z-index:210;display:none;background:#12132a;align-items:center;justify-content:center;overflow:hidden}#fl.on{display:flex}
#flt{font-size:clamp(48px,16vw,150px);font-weight:900;color:#ffe27a;text-shadow:0 8px 0 #b36b00;z-index:2;opacity:0}
.door{position:absolute;top:0;bottom:0;width:50%;background:repeating-linear-gradient(90deg,#9aa3b8 0 6px,#7d869c 6px 12px);border:6px solid #4b5266;z-index:1}
#dl{left:0}#dr{right:0}
#fl.on .door{animation:dopen 4s ease-in-out forwards}#fl.on #flt{animation:tshow 4s ease-in-out forwards}
@keyframes dopen{0%{transform:translateX(0)}30%{transform:translateX(0)}60%{transform:translateX(var(--d))}85%{transform:translateX(var(--d))}100%{transform:translateX(0)}}
#dl{--d:-100%}#dr{--d:100%}
@keyframes tshow{0%,25%{opacity:0;transform:scale(.4)}45%,80%{opacity:1;transform:scale(1)}100%{opacity:0;transform:scale(1.4)}}
#res{position:fixed;inset:0;z-index:150;background:#000a;display:none;align-items:center;justify-content:center;flex-direction:column;gap:14px;text-align:center}#res.on{display:flex}
#res h2{font-size:clamp(34px,9vw,70px);margin:0;text-shadow:0 5px 0 #000}
.pl{display:flex;align-items:center;gap:8px;background:#23265a;border-radius:10px;padding:6px 10px;margin:4px 0;text-align:left}
#toast{position:fixed;top:60px;left:50%;transform:translateX(-50%);z-index:300;background:#000c;border:2px solid #ffd54a;border-radius:12px;padding:8px 14px;display:none;font-weight:700}
</style>
</head>
<body>
<div id="nav">
  <button id="burger" class="tab">☰</button>
  <button class="tab" data-p="shop">🛍 スキンショップ</button>
  <button class="tab" data-p="quest">📜 クエスト</button>
  <button class="tab" data-p="titles">🏅 称号</button>
  <span id="shards">✏ 0</span>
</div>
<div id="drawer">
  <h3>👤 アカウント</h3><div id="accInfo">未ログイン</div>
  <input id="accName" placeholder="ユーザー名（2〜12文字）" maxlength="12">
  <div class="row"><button class="btn s" id="bReg">登録</button><button class="btn s b" id="bRen">変更</button><button class="btn s r" id="bOut">ログアウト</button></div>
  <input id="accKey" placeholder="ログインキー（引き継ぎ）"><button class="btn s b" id="bKey">キーでログイン</button>
  <h3>🤝 フレンド</h3>
  <input id="fName" placeholder="フレンドのユーザー名"><input id="fPass" placeholder="相手のフレンドパスワード" type="password">
  <button class="btn s g" id="bAdd">フレンド追加</button>
  <input id="myPass" placeholder="自分のフレンドパスワード(4〜20)" type="password"><button class="btn s b" id="bPass">パスワード設定</button>
  <div id="accMsg" style="color:#ffe27a;font-size:13px;margin:6px 0"></div>
  <div id="flist"></div>
</div>
<div id="prev"><canvas id="pc" width="170" height="200"></canvas><b id="pn"></b></div>
<div id="panel"></div>

<div id="title" class="scr on">
  <h1>🧽 消しゴム奪取<br>＆エレベーター脱出</h1>
  <div class="card">
    <div class="row"><input id="pname" placeholder="ニックネーム" maxlength="12" style="flex:1">
    <select id="floors"><option value="1">CPU戦 1階</option><option value="2">2階</option><option value="3">3階</option><option value="5">5階</option></select></div>
    <div class="row" style="margin-top:10px"><button class="btn g" id="bQuick">🌏 オンラインマッチ</button><button class="btn" id="bCpu">🤖 CPU戦</button></div>
    <div class="row" style="margin-top:10px"><button class="btn b" id="bCreate">🏠 ルーム作成</button>
    <input id="code" placeholder="5桁コード" maxlength="5" inputmode="numeric" style="width:110px"><button class="btn b" id="bJoin">参加</button></div>
    <div id="err" style="color:#ff8a8a;min-height:20px;margin-top:6px"></div>
  </div>
  <div style="font-size:12px;opacity:.8">移動: WASD/矢印 ・ 決定/設置/宝箱: Space ・ アイテム: Q ・ しゃがみ: C</div>
</div>

<div id="lobby" class="scr">
  <h2 style="margin:0">ルーム <span id="lcode" style="color:#ffe27a"></span></h2>
  <div class="card"><div id="lplayers"></div>
    <div class="row" id="lroles" style="margin-top:8px"><button class="btn s" data-r="auto">🎲 おまかせ</button><button class="btn s g" data-r="runner">🏃 逃げ</button><button class="btn s r" data-r="oni">👹 鬼</button></div>
    <div class="row" id="lskin" style="margin-top:8px"></div>
  </div>
  <div class="card" id="lrules"></div>
  <div class="row"><button class="btn g" id="bStart">▶ スタート</button><button class="btn b" id="bReady">✔ 準備OK</button><button class="btn r" id="bLeave">← タイトル</button></div>
  <div id="lmsg" style="color:#ffe27a"></div>
</div>

<canvas id="cv"></canvas>
<div id="hud">
  <div id="hp"><i></i></div><div id="top"></div><div id="log"></div>
  <div id="tc"><div class="dp"><span class="z"></span><button data-k="u">▲</button><span class="z"></span><button data-k="l">◀</button><span class="z"></span><button data-k="r">▶</button><span class="z"></span><button data-k="d">▼</button><span class="z"></span></div>
  <div class="row" style="flex-direction:column"><button data-a="item">Q</button><button data-a="crouch">C</button><button data-a="act">●</button></div></div>
</div>

<div id="ld"><canvas id="lc"></canvas><div id="ldt">LOADING...</div><div id="ldb"><i></i></div></div>
<div id="fl"><div class="door" id="dl"></div><div class="door" id="dr"></div><div id="flt"></div></div>
<div id="res"><h2 id="rt"></h2><div id="rs" style="font-size:18px"></div>
  <div class="row"><button class="btn b" id="rTitle">🏠 タイトルに戻る</button><button class="btn g" id="rLobby">🚪 ロビーに戻る</button></div></div>
<div id="toast"></div>
<script src="/socket.io/socket.io.js"></script>
<script>
(function(){
'use strict';
const $=id=>document.getElementById(id);
const on=(id,ev,fn)=>{const e=typeof id==='string'?$(id):id;if(e)e.addEventListener(ev,fn);};
const tx=(id,t)=>{const e=$(id);if(e)e.textContent=t;};
const show=(id,v)=>{const e=$(id);if(e)e.classList[v?'add':'remove']('on');};
const SK=[['#ffd54a','スタンダード'],['#6ec1ff','ブルー'],['#ff8ac8','ピンク'],['#7be08b','グリーン'],['#c59bff','パープル'],['#ff9f55','オレンジ'],['#e8f0ff','ホワイト'],['#4a4a5a','ブラック']];
const COST=[0,4,6,8,10,14,18,24];
const QUESTS=[
 {id:'e1',n:'初脱出',s:'escape',g:1,r:2},{id:'e2',n:'脱出5回',s:'escape',g:5,r:3},{id:'e3',n:'脱出20回',s:'escape',g:20,r:8},{id:'e4',n:'脱出50回',s:'escape',g:50,r:15},
 {id:'c1',n:'鬼で初捕獲',s:'catch',g:1,r:2},{id:'c2',n:'鬼で捕獲10回',s:'catch',g:10,r:5},{id:'c3',n:'鬼で捕獲40回',s:'catch',g:40,r:12},
 {id:'s1',n:'シャー芯3本集め',s:'shards',g:3,r:1},{id:'s2',n:'シャー芯15本集め',s:'shards',g:15,r:4},{id:'s3',n:'シャー芯50本集め',s:'shards',g:50,r:10},
 {id:'g1',n:'5試合プレイ',s:'games',g:5,r:2},{id:'g2',n:'30試合プレイ',s:'games',g:30,r:8},
 {id:'o1',n:'オンライン対戦3回',s:'online',g:3,r:3},{id:'o2',n:'オンライン勝利10回',s:'onwin',g:10,r:8},
 {id:'p1',n:'ポーションで回復5回',s:'potion',g:5,r:2},{id:'i1',n:'宝箱アイテム10個',s:'items',g:10,r:4},
 {id:'f1',n:'CPU戦で3階クリア',s:'floors',g:3,r:3},{id:'f2',n:'CPU戦で合計20階クリア',s:'floors',g:20,r:10}];
const TITLES=[{n:'新入生',s:'games',g:0},{n:'脱出見習い',s:'escape',g:1},{n:'逃げの達人',s:'escape',g:20},{n:'エレベーターの覇者',s:'escape',g:50},
 {n:'新米鬼',s:'catch',g:1},{n:'鬼軍曹',s:'catch',g:15},{n:'鬼神',s:'catch',g:50},{n:'シャー芯コレクター',s:'shards',g:20},{n:'皆勤賞',s:'games',g:30},{n:'全国区',s:'onwin',g:10},{n:'塔の踏破者',s:'floors',g:20}];
// ---------- save ----------
let SV={shards:3,own:[0],skin:0,st:{},done:{},title:'新入生',name:'',token:''};
try{const j=JSON.parse(localStorage.getItem('ee9')||'null');if(j&&typeof j==='object')SV=Object.assign(SV,j);}catch(e){}
SV.st=SV.st||{};SV.done=SV.done||{};if(!Array.isArray(SV.own))SV.own=[0];
const save=()=>{try{localStorage.setItem('ee9',JSON.stringify(SV));}catch(e){}tx('shards','✏ '+(SV.shards|0));};
const st=k=>SV.st[k]|0;
function addStat(k,n){SV.st[k]=st(k)+(n||1);if(k==='shards')SV.shards+=n||1;save();}
let tt=0;function toast(t){const e=$('toast');if(!e)return;e.textContent=t;e.style.display='block';clearTimeout(tt);tt=setTimeout(()=>e.style.display='none',2600);}
function claim(id){const q=QUESTS.find(x=>x.id===id);if(!q||SV.done[id]||st(q.s)<q.g)return;SV.done[id]=1;SV.shards+=q.r;save();toast('🎉 クエスト達成！ ✏+'+q.r);renderPanel();}
// ---------- skin drawing ----------
function drawChar(c,x,y,r,sk,oni,t,mv,alpha){
  c.save();c.globalAlpha=alpha==null?1:alpha;c.translate(x,y);
  c.fillStyle='#0004';c.beginPath();c.ellipse(0,r*1.05,r*.9,r*.28,0,0,7);c.fill();
  const sw=mv?Math.sin(t*14)*r*.5:0;c.strokeStyle='#222';c.lineWidth=r*.26;c.lineCap='round';
  c.beginPath();c.moveTo(-r*.3,r*.7);c.lineTo(-r*.3+sw,r*1.1);c.moveTo(r*.3,r*.7);c.lineTo(r*.3-sw,r*1.1);c.stroke();
  const col=oni?'#e03a3a':(SK[sk|0]||SK[0])[0];
  c.fillStyle=col;c.strokeStyle='#222';c.lineWidth=r*.12;c.beginPath();c.arc(0,0,r,0,7);c.fill();c.stroke();
  c.fillStyle='#fff';c.beginPath();c.arc(r*.28,-r*.15,r*.24,0,7);c.arc(r*.72*.8,-r*.15,r*.2,0,7);c.fill();
  c.fillStyle='#111';c.beginPath();c.arc(r*.34,-r*.15,r*.1,0,7);c.arc(r*.6,-r*.15,r*.09,0,7);c.fill();
  if(oni){c.fillStyle='#fff';[-1,1].forEach(s=>{c.beginPath();c.moveTo(s*r*.5,-r*.8);c.lineTo(s*r*.85,-r*1.5);c.lineTo(s*r*.15,-r*.95);c.fill();});
    c.strokeStyle='#111';c.lineWidth=r*.12;c.beginPath();c.moveTo(r*.1,-r*.5);c.lineTo(r*.9,-r*.3);c.stroke();}
  else{c.fillStyle='#111';c.fillRect(0,r*.25,r*.5,r*.08);
    const a=sk|0;c.fillStyle='#ffd54a';
    if(a===1){c.fillStyle='#d33';c.beginPath();c.arc(0,-r*.7,r*.7,Math.PI,0);c.fill();c.fillRect(0,-r*.75,r*1.1,r*.18);}
    else if(a===2){c.strokeStyle='#111';c.lineWidth=r*.1;c.strokeRect(r*.1,-r*.35,r*.35,r*.35);c.strokeRect(r*.55,-r*.35,r*.3,r*.3);}
    else if(a===3){c.fillStyle='#fff';c.beginPath();for(let i=0;i<10;i++){const rr=i%2?r*.12:r*.3,an=i*Math.PI/5-1.57;c.lineTo(-r*.4+Math.cos(an)*rr,r*.3+Math.sin(an)*rr);}c.fill();}
    else if(a===4){c.beginPath();c.moveTo(-r*.6,-r*.85);c.lineTo(-r*.6,-r*1.5);c.lineTo(-r*.3,-r*1.1);c.lineTo(0,-r*1.6);c.lineTo(r*.3,-r*1.1);c.lineTo(r*.6,-r*1.5);c.lineTo(r*.6,-r*.85);c.fill();}
    else if(a===5){c.fillStyle='#e33';c.fillRect(-r,-r*.6,r*2,r*.22);}
    else if(a===6){c.fillStyle='#ff4d8d';c.beginPath();c.moveTo(0,-r);c.lineTo(-r*.5,-r*1.4);c.lineTo(-r*.5,-r*.6);c.moveTo(0,-r);c.lineTo(r*.5,-r*1.4);c.lineTo(r*.5,-r*.6);c.fill();}
    else if(a===7){c.fillStyle=col;c.strokeStyle='#222';[-1,1].forEach(s=>{c.beginPath();c.moveTo(s*r*.2,-r*.9);c.lineTo(s*r*.8,-r*1.5);c.lineTo(s*r*.9,-r*.5);c.closePath();c.fill();c.stroke();});}}
  c.restore();
}
// ---------- state / socket ----------
const S={screen:'title',snap:null,init:null,floors:1,floor:1,solo:false,ended:false,lobby:null,loadAt:0,keys:{u:0,d:0,l:0,r:0},sent:'',log:[],ft:0};
let sock=null;
try{sock=typeof io==='function'?io():null;}catch(e){sock=null;}
const emit=(ev,d)=>{try{if(sock&&sock.connected!==false)sock.emit(ev,d);}catch(e){}};
const myName=()=>((($('pname')||{}).value||SV.name||'').trim()||'プレイヤー');
const prof=()=>({name:myName(),skin:SV.skin|0});
function scr(name){
  S.screen=name;
  show('title',name==='title');show('lobby',name==='lobby');show('cv',name==='game');show('hud',name==='game');
  if(name!=='game')show('res',false);
}
// ---------- loading screen ----------
let ldRun=false,ldStart=0;
function showLoad(text,min){
  tx('ldt',text);show('ld',true);S.loadAt=Date.now()+(min||1500);ldStart=performance.now();
  if(!ldRun){ldRun=true;requestAnimationFrame(ldLoop);}
}
function hideLoad(){const w=Math.max(0,S.loadAt-Date.now());setTimeout(()=>{show('ld',false);},w);}
function ldLoop(now){
  const ld=$('ld'),cv=$('lc');if(!ld||!ld.classList.contains('on')){ldRun=false;return;}
  if(cv){const W=cv.width=cv.clientWidth||innerWidth,H=cv.height=cv.clientHeight||innerHeight,c=cv.getContext('2d');if(c){
    const t=(now-ldStart)/1000,gy=H*.78;
    c.fillStyle='#fff';[[.2,.12],[.55,.2],[.8,.1]].forEach(([a,b],i)=>{const x=((a*W-t*30*(i+1))%(W+200)+W+200)%(W+200)-100;c.beginPath();c.arc(x,H*b+40,34,0,7);c.arc(x+30,H*b+30,40,0,7);c.arc(x+62,H*b+44,30,0,7);c.fill();});
    c.fillStyle='#6fcf5a';c.fillRect(0,gy,W,H-gy);c.fillStyle='#4aa83a';c.fillRect(0,gy,W,10);
    c.fillStyle='#c9964f';for(let i=-1;i<W/60+2;i++){const x=i*60-(t*420)%60;c.fillRect(x,gy+30,30,8);}
    const r=Math.min(46,H*.07),bob=Math.abs(Math.sin(t*14))*10;
    const px=W*.55+Math.sin(t*2)*10;
    drawChar(c,px,gy-r*1.1-bob,r,SV.skin,false,t,true);
    drawChar(c,px-r*3.2+Math.sin(t*3)*14,gy-r*1.3-Math.abs(Math.sin(t*14+1))*10,r*1.25,0,true,t,true);
    c.fillStyle='#fff';c.font='bold '+r*.5+'px sans-serif';c.fillText('💦',px-r*1.8,gy-r*2.2);
  }}
  const bi=document.querySelector('#ldb i');if(bi)bi.style.width=(((now-ldStart)/20)%100)+'%';
  requestAnimationFrame(ldLoop);
}
// ---------- title actions ----------
function err(t){tx('err',t||'');}
function newName(){SV.name=myName();save();}
on('bCpu','click',()=>{newName();startCpu(1);});
function startCpu(f){
  S.floors=parseInt(($('floors')||{}).value,10)||1;S.floor=f;S.solo=true;S.ended=false;
  showLoad(S.floors>1?f+'階 LOADING...':'LOADING...',1800);emit('solo',prof());
}
on('bQuick','click',()=>{newName();S.solo=false;showLoad('MATCHING...',1800);emit('quick',prof());});
on('bCreate','click',()=>{newName();S.solo=false;showLoad('ROOM...',900);emit('create',prof());});
on('bJoin','click',()=>{newName();S.solo=false;const c=(($('code')||{}).value||'').replace(/\D/g,'');if(c.length!==5){err('5桁のコードを入力してね');return;}showLoad('JOINING...',900);emit('join',Object.assign({code:c},prof()));});
on('bLeave','click',()=>{emit('leave');scr('title');});
on('bStart','click',()=>emit('start'));
let rdy=false;on('bReady','click',()=>{rdy=!rdy;emit('setReady',rdy);});
document.querySelectorAll('#lroles button').forEach(b=>on(b,'click',()=>emit('setRole',b.dataset.r)));
on('rTitle','click',()=>{emit('leave');show('res',false);S.snap=null;scr('title');});
on('rLobby','click',()=>{show('res',false);if(S.solo||!S.lobby){emit('leave');S.snap=null;scr('title');}else{emit('backToLobby');S.snap=null;scr('lobby');}});
// ---------- socket events ----------
if(sock){
sock.on('connect',()=>{if(SV.token)emit('auth',{token:SV.token});});
sock.on('errmsg',m=>{show('ld',false);err(m);toast(m);scr('title');});
sock.on('lobby',d=>{
  if(!d)return;S.lobby=d;hideLoad();
  if(d.state==='lobby'){S.snap=null;if(S.screen!=='lobby')scr('lobby');renderLobby();}
  else renderLobby();
});
sock.on('init',d=>{
  if(!d)return;S.init=d;S.snap=null;S.ended=false;S.solo=!!d.solo;S.log=[];hideLoad();scr('game');show('res',false);
  tx('top','');
});
sock.on('state',s=>{
  if(!s)return;S.snap=s;
  if(s.s&&s.s!=='playing'&&!S.ended){S.ended=true;onEnd(s);}
});
sock.on('ev',m=>{
  if(typeof m!=='string')return;S.log.push([m,Date.now()]);if(S.log.length>5)S.log.shift();
  const r=S.snap&&S.snap.role;
  if(m.indexOf('💥')===0&&r==='oni')addStat('catch');
  if(m.indexOf('🧪')===0)addStat('potion');
  if(m.indexOf('🎁')===0)addStat('items');
});
sock.on('profile',p=>{if(!p)return;tx('accInfo',p.name?('ログイン中: '+p.name+(p.hasPass?' 🔒':'')+' / フレンド'+p.friends):'未ログイン');if(p.name){SV.name=p.name;const n=$('pname');if(n)n.value=p.name;save();}});
sock.on('registered',d=>{if(d&&d.token){SV.token=d.token;save();const k=$('accKey');if(k)k.value=d.token;}});
sock.on('authFail',()=>{SV.token='';save();});
['accMsg','friendMsg'].forEach(e=>sock.on(e,d=>{if(d)tx('accMsg',d.msg||'');}));
sock.on('friends',l=>renderFriends(l));
sock.on('invite',d=>{if(d&&confirm(d.from+' さんから招待！参加する？')){emit('join',Object.assign({code:d.code},prof()));}});
}
// ---------- account UI ----------
on('bReg','click',()=>emit('register',{name:($('accName')||{}).value}));
on('bRen','click',()=>emit('rename',{name:($('accName')||{}).value}));
on('bOut','click',()=>{SV.token='';save();emit('logout');});
on('bKey','click',()=>emit('loginKey',{token:($('accKey')||{}).value}));
on('bAdd','click',()=>emit('addFriend',{name:($('fName')||{}).value,pass:($('fPass')||{}).value}));
on('bPass','click',()=>emit('setFriendPass',{pass:($('myPass')||{}).value}));
function renderFriends(l){
  const el=$('flist');if(!el)return;el.innerHTML='';
  (Array.isArray(l)?l:[]).forEach(f=>{
    const d=document.createElement('div');d.className='pl';
    d.innerHTML='<span>'+(f.online?'🟢':'⚪')+'</span><b style="flex:1"></b>';d.querySelector('b').textContent=f.name+(f.room?' ['+f.room+']':'');
    const mk=(t,cls,fn)=>{const b=document.createElement('button');b.className='btn s '+cls;b.textContent=t;b.onclick=fn;d.appendChild(b);};
    if(f.room)mk('参加','g',()=>{S.solo=false;showLoad('JOINING...',900);emit('joinFriend',{name:f.name,skin:SV.skin});toggleDrawer(false);});
    if(S.lobby&&f.online)mk('招待','b',()=>emit('invite',{name:f.name}));
    mk('✕','r',()=>emit('removeFriend',{name:f.name}));
    el.appendChild(d);
  });
}
// ---------- drawer / preview / panel ----------
function toggleDrawer(v){
  const d=$('drawer'),p=$('prev');if(!d||!p)return;
  const o=v==null?!d.classList.contains('on'):v;
  d.classList[o?'add':'remove']('on');p.classList[o?'add':'remove']('on');
  tx('pn',(SK[SV.skin]||SK[0])[1]+' / '+SV.title);
  if(o)emit('friends');
}
on('burger','click',e=>{e.stopPropagation();toggleDrawer();});
let panelTab=null;
document.querySelectorAll('#nav .tab[data-p]').forEach(b=>on(b,'click',()=>{panelTab=panelTab===b.dataset.p?null:b.dataset.p;toggleDrawer(false);renderPanel();}));
function renderPanel(){
  const p=$('panel');if(!p)return;
  document.querySelectorAll('#nav .tab[data-p]').forEach(b=>b.classList[b.dataset.p===panelTab?'add':'remove']('on'));
  if(!panelTab){p.classList.remove('on');p.innerHTML='';return;}
  p.classList.add('on');p.innerHTML='';
  if(panelTab==='shop'){
    p.innerHTML='<h2 style="text-align:center">スキンショップ（✏ '+SV.shards+'）</h2><div class="skins" id="sg"></div>';
    SK.forEach((s,i)=>{
      const own=SV.own.includes(i),d=document.createElement('div');d.className='skc'+(SV.skin===i?' sel':'');
      const c=document.createElement('canvas');c.width=90;c.height=90;d.appendChild(c);
      const g=c.getContext('2d');if(g)drawChar(g,45,42,24,i,false,0,false);
      const n=document.createElement('div');n.textContent=s[1];d.appendChild(n);
      const b=document.createElement('button');b.className='btn s'+(own?' g':'');b.textContent=own?(SV.skin===i?'使用中':'選ぶ'):('✏ '+COST[i]);
      b.onclick=()=>{if(own){SV.skin=i;emit('setSkin',i);}else if(SV.shards>=COST[i]){SV.shards-=COST[i];SV.own.push(i);SV.skin=i;toast('ゲット！');}else toast('シャー芯が足りない');save();renderPanel();};
      d.appendChild(b);const g2=$('sg');if(g2)g2.appendChild(d);
    });
  }else if(panelTab==='quest'){
    p.innerHTML='<h2 style="text-align:center">クエスト・実績</h2>';
    QUESTS.forEach(q=>{
      const v=Math.min(st(q.s),q.g),d=document.createElement('div');d.className='item';
      d.innerHTML='<div style="flex:1"><b></b><div class="bar"><i style="width:'+(v/q.g*100)+'%"></i></div><small>'+v+' / '+q.g+'　報酬 ✏'+q.r+'</small></div>';
      d.querySelector('b').textContent=q.n;
      const b=document.createElement('button');b.className='btn s g';b.textContent=SV.done[q.id]?'済':(v>=q.g?'受取':'…');b.disabled=!!SV.done[q.id]||v<q.g;b.onclick=()=>claim(q.id);
      d.appendChild(b);p.appendChild(d);
    });
  }else{
    p.innerHTML='<h2 style="text-align:center">称号（現在: '+SV.title+'）</h2>';
    TITLES.forEach(t=>{
      const ok=st(t.s)>=t.g,d=document.createElement('div');d.className='item';
      d.innerHTML='<b style="flex:1"></b>';d.querySelector('b').textContent=(ok?'🏅 ':'🔒 ')+t.n+'　('+t.s+' '+t.g+')';
      const b=document.createElement('button');b.className='btn s'+(SV.title===t.n?' g':'');b.textContent=SV.title===t.n?'装備中':'装備';b.disabled=!ok;
      b.onclick=()=>{SV.title=t.n;save();renderPanel();};d.appendChild(b);p.appendChild(d);
    });
  }
}
// ---------- lobby ----------
function renderLobby(){
  const d=S.lobby;if(!d)return;
  tx('lcode',d.code||'');
  const pl=$('lplayers');if(pl){pl.innerHTML='';(d.players||[]).forEach(p=>{
    const e=document.createElement('div');e.className='pl';
    const c=document.createElement('canvas');c.width=36;c.height=40;e.appendChild(c);const g=c.getContext('2d');if(g)drawChar(g,18,17,12,p.skin,false,0,false);
    const s=document.createElement('span');s.style.flex='1';s.textContent=p.name+(p.id===d.host?' 👑':'')+(p.id===d.you?' (あなた)':'');e.appendChild(s);
    const r=document.createElement('span');r.textContent={auto:'🎲',runner:'🏃',oni:'👹'}[p.role]+(p.ready?' ✔':'');e.appendChild(r);pl.appendChild(e);});}
  const sk=$('lskin');if(sk){sk.innerHTML='';SV.own.forEach(i=>{const b=document.createElement('button');b.className='btn s'+(SV.skin===i?' g':'');b.textContent=SK[i][1];b.onclick=()=>{SV.skin=i;save();emit('setSkin',i);};sk.appendChild(b);});}
  const host=d.you===d.host;show2('bStart',host);show2('bReady',!host);
  const ru=$('lrules');if(ru){ru.innerHTML='';
    const R=d.rules||{};
    const defs=[['matchTime','制限時間',[120,180,300,420,600]],['placeTime','設置時間',[10,20,30,45,60]],['runnerSpeed','逃げ速度%',[80,100,120]],['oniSpeed','鬼速度%',[80,100,120]]];
    const cur=()=>Object.assign({},R);
    defs.forEach(([k,n,o])=>{const l=document.createElement('label');l.textContent=n+' ';const s=document.createElement('select');s.disabled=!host;
      o.forEach(v=>{const op=document.createElement('option');op.value=v;op.textContent=v;if(+R[k]===v)op.selected=true;s.appendChild(op);});
      s.onchange=()=>{const r=cur();r[k]=+s.value;emit('setRules',r);};l.appendChild(s);l.style.margin='4px';ru.appendChild(l);});
    [['items','宝箱'],['potions','ポーション'],['warps','ワープ'],['crouch','しゃがみ']].forEach(([k,n])=>{const l=document.createElement('label');l.style.margin='4px';const c=document.createElement('input');c.type='checkbox';c.checked=R[k]!==false;c.disabled=!host;
      c.onchange=()=>{const r=cur();r[k]=c.checked;emit('setRules',r);};l.appendChild(c);l.appendChild(document.createTextNode(' '+n));ru.appendChild(l);});}
  tx('lmsg',d.code&&S.lobby&&S.lobby.players&&S.lobby.players.length<2?'相手を待っています…（クイックマッチは約10秒でCPU補充して開始）':'');
}
function show2(id,v){const e=$(id);if(e)e.style.display=v?'':'none';}
// ---------- game end ----------
function onEnd(s){
  const role=s.role,win=(role==='runner'&&s.s==='runwin')||(role==='oni'&&s.s!=='runwin');
  addStat('games');if(!S.solo)addStat('online');
  if(role==='runner'&&s.s==='runwin')addStat('escape');
  if(win&&!S.solo)addStat('onwin');
  if(S.solo&&role==='runner'&&s.s==='runwin'){
    addStat('floors');
    if(Math.random()<.55){const n=1+Math.floor(Math.random()*3);addStat('shards',n);toast('✏ シャー芯を'+n+'本ゲット！');}
    if(S.floor<S.floors){
      const nf=++S.floor;const f=$('flt');if(f)f.textContent=nf+'階戦';
      show('fl',false);void document.body.offsetWidth;show('fl',true);
      setTimeout(()=>{show('fl',false);S.ended=false;showLoad(nf+'階 LOADING...',1200);emit('solo',prof());},4000);
      return;
    }
  }
  const msg={runwin:'エレベーターで脱出成功！',oniwin:'全員つかまった…',timeup:'タイムアップ！'}[s.s]||'';
  setTimeout(()=>{if(!S.ended||S.screen!=='game')return;tx('rt',win?'🎉 WIN!':'😵 LOSE...');
    tx('rs',msg+(S.solo&&S.floors>1?'（'+S.floor+'/'+S.floors+'階）':''));show('res',true);},1200);
}
// ---------- input ----------
const KM={ArrowUp:'u',KeyW:'u',ArrowDown:'d',KeyS:'d',ArrowLeft:'l',KeyA:'l',ArrowRight:'r',KeyD:'r'};
function sendInput(){const j=JSON.stringify(S.keys);if(j!==S.sent){S.sent=j;emit('input',S.keys);}}
addEventListener('keydown',e=>{
  if(S.screen!=='game'||(e.target&&e.target.tagName==='INPUT'))return;
  if(KM[e.code]){S.keys[KM[e.code]]=1;sendInput();e.preventDefault();}
  else if(e.code==='Space'||e.code==='KeyE'){emit('action');e.preventDefault();}
  else if(e.code==='KeyQ')emit('useItem');
  else if(e.code==='KeyC'||e.code==='ShiftLeft')emit('crouch');
});
addEventListener('keyup',e=>{if(KM[e.code]){S.keys[KM[e.code]]=0;sendInput();}});
addEventListener('blur',()=>{S.keys={u:0,d:0,l:0,r:0};sendInput();});
document.querySelectorAll('#tc button').forEach(b=>{
  const k=b.dataset.k,a=b.dataset.a;
  on(b,'pointerdown',e=>{e.preventDefault();if(k){S.keys[k]=1;sendInput();}else if(a==='act')emit('action');else if(a==='item')emit('useItem');else emit('crouch');});
  const up=()=>{if(k){S.keys[k]=0;sendInput();}};on(b,'pointerup',up);on(b,'pointerleave',up);on(b,'pointercancel',up);
});
// ---------- game render ----------
const cv=$('cv'),cx=cv?cv.getContext('2d'):null;
function resize(){if(cv){cv.width=innerWidth;cv.height=innerHeight;}}addEventListener('resize',resize);resize();
let clock=0,pt=0;
function frame(now){
  requestAnimationFrame(frame);const dt=Math.min(.05,(now-pt)/1000||0);pt=now;clock+=dt;
  if(S.screen==='game')try{draw();}catch(e){}
  const pc=$('pc'),pcl=$('prev');
  if(pc&&pcl&&pcl.classList.contains('on')){const g=pc.getContext('2d');if(g){g.clearRect(0,0,pc.width,pc.height);drawChar(g,85,92+Math.sin(clock*8)*4,48,SV.skin,false,clock,true);}}
}
requestAnimationFrame(frame);
function draw(){
  const s=S.snap,I=S.init;if(!cx||!s||!I||!s.me||!s.cam||!I.grid)return;
  const W=cv.width,H=cv.height,T=I.T||80,N=I.N||19,sc=Math.min(W,H)/560;
  cx.setTransform(1,0,0,1,0,0);cx.fillStyle='#0b0c1f';cx.fillRect(0,0,W,H);
  cx.setTransform(sc,0,0,sc,W/2-s.cam.x*sc,H/2-s.cam.y*sc);
  const vx0=Math.max(0,Math.floor((s.cam.x-W/2/sc)/T)),vx1=Math.min(N-1,Math.ceil((s.cam.x+W/2/sc)/T));
  const vy0=Math.max(0,Math.floor((s.cam.y-H/2/sc)/T)),vy1=Math.min(N-1,Math.ceil((s.cam.y+H/2/sc)/T));
  for(let y=vy0;y<=vy1;y++){const row=I.grid[y]||'';for(let x=vx0;x<=vx1;x++){
    if(row[x]==='1'){cx.fillStyle='#4651b8';cx.fillRect(x*T,y*T,T,T);cx.fillStyle='#6b78ee';cx.fillRect(x*T,y*T,T,T*.8);cx.fillStyle='#37409a';cx.fillRect(x*T,y*T+T*.8,T,T*.2);}
    else{cx.fillStyle=(x+y)%2?'#2a2d52':'#30345e';cx.fillRect(x*T,y*T,T,T);}}}
  // elevators
  const el=s.el||{door:0};(I.elevs||[]).forEach((E,i)=>{
    const x=E.tx*T,y=E.ty*T,o=Math.max(0,Math.min(1,el.door||0)),act=(i===s.side);
    cx.fillStyle=act?'#ffd54a':'#8a93a8';cx.fillRect(x,y,T,T);cx.fillStyle='#222';cx.fillRect(x+T*.1,y+T*.1,T*.8,T*.8);
    cx.fillStyle=act?'#e0a800':'#667';const w=T*.4*(1-o*(act?1:0));
    if(E.dy)cx.fillRect(x+T*.1,y+T*.1,w,T*.8),cx.fillRect(x+T*.9-w,y+T*.1,w,T*.8);else cx.fillRect(x+T*.1,y+T*.1,T*.8,w),cx.fillRect(x+T*.1,y+T*.9-w,T*.8,w);
  });
  (I.pads||[]).forEach(p=>{cx.strokeStyle=p.pair?'#ff8ac8':'#6ec1ff';cx.lineWidth=5;cx.beginPath();cx.arc(p.x,p.y,24+Math.sin(clock*4)*2,0,7);cx.stroke();cx.fillStyle=cx.strokeStyle+'';cx.globalAlpha=.25;cx.fill();cx.globalAlpha=1;});
  (I.chests||[]).forEach((c,i)=>{const o=s.ch&&s.ch[i];cx.font='34px serif';cx.textAlign='center';cx.textBaseline='middle';cx.globalAlpha=o?.35:1;cx.fillText(o?'📭':'🎁',c.x,c.y);cx.globalAlpha=1;});
  (I.potions||[]).forEach((c,i)=>{if(s.pt&&s.pt[i])return;cx.font='28px serif';cx.textAlign='center';cx.textBaseline='middle';cx.fillText('🧪',c.x,c.y);});
  if(s.er&&s.er.x!=null&&!s.er.c){cx.font='30px serif';cx.textAlign='center';cx.textBaseline='middle';cx.fillText('🧽',s.er.x,s.er.y+Math.sin(clock*5)*3);}
  if(s.hint){cx.strokeStyle='#ffd54a88';cx.setLineDash([10,8]);cx.lineWidth=4;cx.beginPath();cx.arc(s.hint.x,s.hint.y,s.hint.r,0,7);cx.stroke();cx.setLineDash([]);}
  if(s.ping){cx.strokeStyle='#ff4d4d';cx.lineWidth=5;cx.beginPath();cx.arc(s.ping.x,s.ping.y,30+(clock*60%40),0,7);cx.stroke();}
  const mv=k=>k;const mov=!!(S.keys.u||S.keys.d||S.keys.l||S.keys.r);
  (s.ents||[]).forEach(e=>{if(!e)return;const oni=e.role==='oni';
    drawChar(cx,e.x,e.y,oni?22:18,e.sk,oni,clock,false,e.al===false?.25:(e.iv?.4:1));
    cx.font='bold 13px sans-serif';cx.fillStyle='#fff';cx.textAlign='center';cx.fillText((e.e?'🧽':'')+(e.st?'💫':'')+(e.n||''),e.x,e.y-30);});
  const m=s.me,mo=s.role==='oni';
  if(m.al!==false)drawChar(cx,m.x,m.y,mo?22:18,I.skin,mo,clock,mov,(m.iv>0||m.cr>0)?.45:(m.inv&&Math.floor(clock*10)%2?.4:1));
  else{cx.font='36px serif';cx.fillText('👻',m.x,m.y);}
  cx.font='bold 13px sans-serif';cx.fillStyle='#ffd54a';cx.textAlign='center';cx.fillText((m.e?'🧽 ':'')+(m.st?'💫 ':'')+'▼',m.x,m.y-32);
  // darkness
  cx.setTransform(1,0,0,1,0,0);
  const lr=((I.cfg&&I.cfg.lightR&&I.cfg.lightR[s.role])||240)*sc*1.1;
  const sx=W/2+(m.x-s.cam.x)*sc,sy=H/2+(m.y-s.cam.y)*sc;
  const g=cx.createRadialGradient(sx,sy,lr*.35,sx,sy,lr);g.addColorStop(0,'rgba(5,5,18,0)');g.addColorStop(1,'rgba(5,5,18,.94)');
  cx.fillStyle=g;cx.fillRect(0,0,W,H);
  // HUD
  const hp=document.querySelector('#hp i');if(hp)hp.style.width=Math.max(0,m.hp||0)+'%';
  const hpw=$('hp');if(hpw)hpw.style.display=mo?'none':'block';
  const mm=Math.floor(Math.max(0,s.t||0)/60),ss=String(Math.floor(Math.max(0,s.t||0)%60)).padStart(2,'0');
  let line=(mo?'👹 鬼':'🏃 逃げ')+(S.solo&&S.floors>1?' ｜ '+S.floor+'階':'')+' ｜ ⏱ '+mm+':'+ss+' ｜ 生存 '+(s.n!=null?s.n:'-');
  if(s.ph==='place')line+='<br>'+(mo?'消しゴムを置け！(Space)':'鬼が消しゴムを隠している…')+' '+Math.ceil(s.pl||0);
  else if(s.bd)line+='<br>🚪 エレベーター '+(s.bd.left||0).toFixed(1)+'s';
  else if(s.el&&s.el.open)line+='<br>🚪 開放中 '+Math.ceil(s.el.left||0)+'s';
  if(m.item)line+='<br>'+({stun:'💫',boots:'👟',invis:'👻'}[m.item]||'')+' '+(m.item==='stun'?'自動':'Q');
  if(m.st)line+='<br>💫 スタン中';
  const top=$('top');if(top)top.innerHTML=line;
  const lg=$('log');if(lg){const now=Date.now();lg.innerHTML=S.log.filter(l=>now-l[1]<5000).map(l=>'<div></div>').join('');
    [...lg.children].forEach((d,i)=>{const arr=S.log.filter(l=>now-l[1]<5000);d.textContent=arr[i][0];});}
}
// ---------- init ----------
save();renderPanel();
const pn=$('pname');if(pn&&SV.name)pn.value=SV.name;
// どの画面からでもオーバーレイを閉じられる: Escで全メニューを閉じる、タイトル/ロビー画面クリックでドロワーを閉じる
addEventListener('keydown',e=>{if(e.code==='Escape'){toggleDrawer(false);panelTab=null;renderPanel();}});
['title','lobby'].forEach(id=>on(id,'click',e=>{if(!e.target.closest||!e.target.closest('.card'))toggleDrawer(false);}));
})();
</script>
